async function loadSharedState(){
 const {data,error}=await sb.from('align_app_state').select('data,version,updated_at').eq('id','main').maybeSingle();
 if(error)throw error;
 const hasLocal=meaningfulWorkspace(legacyState);
 if(!data){
   const seed=hasLocal?{company:legacyState.company,projects:legacyState.projects||[]}:{company:defaultState().company,projects:[]};
   const {data:created,error:createErr}=await sb.from('align_app_state').insert({id:'main',data:seed,version:1,updated_by:authUser.id}).select('data,version,updated_at').single();
   if(createErr){
     const retry=await sb.from('align_app_state').select('data,version,updated_at').eq('id','main').single();
     if(retry.error)throw createErr;
     preserveUi(retry.data.data);remoteVersion=Number(retry.data.version||1);state.lastSaved=retry.data.updated_at||'';
   }else{preserveUi(created.data);remoteVersion=Number(created.version||1);state.lastSaved=created.updated_at||'';if(hasLocal){localStorage.removeItem('align_full_v1');legacyState=null;}}
 }else{
   const remote=data.data||{};
   const remoteEmpty=!meaningfulWorkspace(remote);
   if(remoteEmpty&&hasLocal){
     // First real workstation wins only when the shared row is still genuinely empty.
     const next=Number(data.version||1)+1;
     const payload={company:legacyState.company,projects:legacyState.projects||[]};
     const seeded=await sb.from('align_app_state').update({data:payload,version:next,updated_at:new Date().toISOString(),updated_by:authUser.id}).eq('id','main').eq('version',data.version).select('data,version,updated_at').single();
     if(seeded.error)throw seeded.error;
     preserveUi(seeded.data.data);remoteVersion=Number(seeded.data.version||next);state.lastSaved=seeded.data.updated_at||'';localStorage.removeItem('align_full_v1');legacyState=null;
   }else{preserveUi(remote);remoteVersion=Number(data.version||1);state.lastSaved=data.updated_at||'';}
 }
 state.loggedInName=loggedInDisplayName();
}
async function flushRemoteSave(){
 if(!authUser||saveInFlight){pendingSave=true;return}
 saveInFlight=true;pendingSave=false;setSyncStatus('saving');
 const payload=JSON.parse(JSON.stringify(sharedPayload()));
 const expected=remoteVersion;
 const next=expected+1;
 const {data,error}=await sb.from('align_app_state').update({data:payload,version:next,updated_at:new Date().toISOString(),updated_by:authUser.id}).eq('id','main').eq('version',expected).select('version,updated_at');
 if(error){saveInFlight=false;setSyncStatus('error');console.error(error);toast('Could not sync changes');return}
 if(!data||!data.length){
   saveInFlight=false;setSyncStatus('error');
   const latest=await sb.from('align_app_state').select('data,version').eq('id','main').single();
   if(!latest.error){preserveUi(latest.data.data);remoteVersion=Number(latest.data.version||remoteVersion);state.loggedInName=loggedInDisplayName();render();toast('A newer team change was loaded. Please retry your last edit.');}
   return;
 }
 remoteVersion=Number(data[0].version);state.lastSaved=new Date().toISOString();saveInFlight=false;setSyncStatus('live');
 syncPublishedClientPortals().catch(console.error);
 if(pendingSave)flushRemoteSave();
}

const ACTUAL_PROCESS_VERSION=2;
const ACTUAL_STEP_TITLES=[
 ['Design Discovery Form Sent','Discovery Form & Creative Brief Completed','Internal Review of Discovery & Brief','Design Discovery / Client Review Meeting'],
 ['Architectural Development Started','First-Round Rough Draft of Plans','Internal Plan Review','First-Round Client Plan Review','Selection Takeoffs & Identification'],
 ['Design Direction & Intent Meeting','Design Direction Established','Major Product Selections In Progress','Major Selections Complete'],
 ['Begin 3D Renderings','Internal Rendering Review','Client Rendering Review','Final Architectural Plan Details','Final Internal Review','Final Client Review'],
 ['Trade / Subcontractor Pricing','Formal Project Budget Created','Internal Review of Formal Proposal','Formal Proposal Presented to Client'],
 ['Construction Agreement Sent','Construction Contract Signed','Final Scheduling Phase','Project Handoff / Production Setup']
];
function applyActualProcessMigration(){
 if((state.company.actualProcessVersion||0)>=ACTUAL_PROCESS_VERSION)return;
 const fresh=defaultState().company.phases;
 const oldPhases=[...(state.company.phases||[])].sort((a,b)=>a.number-b.number);
 // Keep each phase's identity, color, client description and number where possible, but replace the checklist with the approved real steps.
 state.company.phases=fresh.map((np,pi)=>{
   const old=oldPhases[pi];
   return {...np,id:old?.id||np.id,number:old?.number??np.number,name:np.name,color:old?.color||np.color,description:old?.description||np.description};
 });
 // Existing projects are migrated by phase + step position so notes/dates/statuses are not thrown away during this prototype update.
 (state.projects||[]).forEach(project=>{
   const oldSteps=project.projectSteps||[];
   const migrated=[];
   state.company.phases.forEach((ph,pi)=>{
     const prior=oldSteps.filter(x=>Number(x.phaseNumber)===Number(ph.number));
     ph.steps.forEach((ts,si)=>{
       const os=prior[si];
       migrated.push({
         id:os?.id||uid(),templateStepId:ts.id,phaseNumber:ph.number,title:ts.title,role:ts.role,
         status:os?.status||'not_started',assignee:os?.assignee||'',assigneeOverridden:!!os?.assigneeOverridden,
         dueDate:os?.dueDate||'',baselineDate:os?.baselineDate||'',completedDate:os?.completedDate||'',
         startedAt:os?.startedAt||'',notes:Array.isArray(os?.notes)?os.notes:[],files:Array.isArray(os?.files)?os.files:[]
       });
     });
   });
   project.projectSteps=migrated;
   recomputeProjectPhase(project);
 });
 state.company.actualProcessVersion=ACTUAL_PROCESS_VERSION;
}
function migrate(){
 if(!state.company)state=defaultState();
 state.company.projectContacts=state.company.projectContacts||[];

function seedProjectSteps(){return allTemplateSteps().map(x=>({id:uid(),templateStepId:x.step.id,phaseNumber:x.phase.number,title:x.step.title,role:x.step.role,status:'not_started',assignee:'',assigneeOverridden:false,dueDate:'',baselineDate:'',notes:[],files:[]}));}

function projectStepsFor(p,phaseNum){return p.projectSteps.filter(s=>Number(s.phaseNumber)===Number(phaseNum));}
function currentStep(p){return p.projectSteps.find(s=>s.status!=='done')||null}
function resolveAssignee(ps){if(ps.assigneeOverridden)return ps.assignee||'';const project=state.projects.find(p=>(p.projectSteps||[]).some(x=>x.id===ps.id));if(project&&ps.role==='Architect'){const c=projectContactById(project.architectId);if(c)return c.name}if(project&&ps.role==='Designer'){const c=projectContactById(project.designerId);if(c)return c.name}const list=state.company.roleAssignees[ps.role]||[];return list[0]||''}

function openTasks(p){return p.tasks.filter(t=>t.status!=='done').length}
function overdueTasks(p){const t=today();return p.tasks.filter(x=>x.status!=='done'&&x.dueDate&&x.dueDate<t).length}
function baselineReady(p){return p.baselineReady||''}
function scheduleVarianceDays(p){
 if(!p.baselineReady)return 0;
 const active=currentStep(p);
 // The active step is the clearest indicator of where the project actually sits versus the frozen baseline.
 // Use the later of its forecast due date or today so an overdue unfinished step keeps accruing delay.
 if(active&&active.baselineDate){
  let forecastPoint=active.dueDate||active.baselineDate;
  if(active.status!=='done'&&today()>forecastPoint)forecastPoint=today();
  return daysBetween(active.baselineDate,forecastPoint);
 }
 // If preconstruction is complete, compare the actual final completion to the frozen baseline-ready date.
 const completed=[...p.projectSteps].reverse().find(s=>s.completedDate);
 if(completed?.completedDate)return daysBetween(p.baselineReady,completed.completedDate);
 return 0;
}
function computedForecastReady(p){
 if(!p.baselineReady)return '';
 return iso(new Date(parseDate(p.baselineReady).getTime()+scheduleVarianceDays(p)*86400000));
}
function forecastReady(p){return computedForecastReady(p)||p.forecastReady||p.baselineReady||''}
function computedForecastConstructionStart(p){
 if(!p.targetStart)return forecastReady(p);

}
function varianceLabel(p){if(!p.baselineReady)return 'No Baseline';const d=scheduleVarianceDays(p);if(d===0)return'On Schedule';return d>0?`${d}d behind`:`${Math.abs(d)}d ahead`}
function recalcForecast(p){if(!p.baselineStart||!p.baselineReady)return;p.forecastReady=computedForecastReady(p);p.forecastConstructionStart=computedForecastConstructionStart(p);}
function generateBaseline(p,start=today()){let cursor=parseDate(start);p.baselineStart=iso(cursor);for(const ph of sortedPhases()){for(const ts of ph.steps){const ps=p.projectSteps.find(x=>x.templateStepId===ts.id)||p.projectSteps.find(x=>x.phaseNumber===ph.number&&x.title===ts.title);if(!ps)continue;cursor=addBusiness(cursor,ts.duration||1);ps.baselineDate=iso(cursor);if(!ps.dueDate)ps.dueDate=ps.baselineDate;}}p.baselineReady=iso(cursor);p.forecastReady=p.baselineReady;p.forecastConstructionStart=p.forecastReady;p.baselineSetDate=today();save(false)}
function ensureProjectStepSync(p){const byTpl=new Map(p.projectSteps.map(x=>[x.templateStepId,x]));const fresh=[];for(const ph of sortedPhases()){for(const ts of ph.steps){let ps=byTpl.get(ts.id);if(!ps)ps={id:uid(),templateStepId:ts.id,phaseNumber:ph.number,title:ts.title,role:ts.role,status:'not_started',assignee:'',assigneeOverridden:false,dueDate:'',baselineDate:'',notes:[],files:[]};ps.phaseNumber=ph.number;ps.title=ts.title;ps.role=ts.role;fresh.push(ps)}}p.projectSteps=fresh;recomputeProjectPhase(p)}

function renderTaskCenter(){const f=taskCenterFilters(),all=allProjectTasks(),me=state.loggedInName||'';let rows=[...all];if(f.assignee==='__me__')rows=rows.filter(t=>t.assignee===me);else if(f.assignee!=='__all__')rows=rows.filter(t=>t.assignee===f.assignee);if(f.project!=='__all__')rows=rows.filter(t=>t.projectId===f.project);if(f.status==='open')rows=rows.filter(t=>t.status!=='done');else if(f.status!=='all')rows=rows.filter(t=>t.status===f.status);const q=(f.search||'').trim().toLowerCase();if(q)rows=rows.filter(t=>[t.title,t.projectName,t.client,t.assignee].some(v=>(v||'').toLowerCase().includes(q)));rows.sort((a,b)=>{const ad=a.dueDate||'9999-12-31',bd=b.dueDate||'9999-12-31';if(ad!==bd)return ad.localeCompare(bd);return (a.projectName||'').localeCompare(b.projectName||'')});const myOpen=all.filter(t=>t.assignee===me&&t.status!=='done').length,teamOpen=all.filter(t=>t.status!=='done').length,overdue=all.filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate<today()).length,dueSoon=all.filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate>=today()&&daysBetween(today(),t.dueDate)<=7).length;const assignees=[...new Set([...activeUsers(),...all.map(t=>t.assignee).filter(Boolean)])].sort();const body=`<div class="task-center-summary"><div class="stat"><b>${myOpen}</b><span>My Open Tasks</span></div><div class="stat"><b>${teamOpen}</b><span>Team Open</span></div><div class="stat"><b>${overdue}</b><span>Overdue</span></div><div class="stat"><b>${dueSoon}</b><span>Due Next 7 Days</span></div></div><div class="card pad"><div class="row between wrap" style="margin-bottom:12px"><div><div class="section-title">Across Every Project</div><h2 class="subhead">Task Center</h2><p class="small muted" style="margin:5px 0 0">One place for each team member to see what they own across every active project.</p></div></div><div class="task-center-controls"><div class="field"><label>Assigned To</label><select onchange="setTaskCenterFilter('assignee',this.value)"><option value="__me__" ${f.assig  const phases=sortedPhases().map(x=>`<div class="phase-pill ${p.currentPhase===x.number?'active':''}"><span class="phase-num">${x.number}</span>${p.currentPhase===x.number?esc(x.name):''}</div>`).join('')+`<div class="phase-pill ${!p.currentPhase?'active':''}"><span class="phase-num">✓</span></div>`;
 const hero=p.baselineReady?`<div class="hero-grid"><div class="hero-main">${stuck?`<div class="blocker-banner"><b>Action needed:</b> ${!assigned?'No one is assigned to this step.':'This step has been active more than 10 days without completion.'}</div>`:''}<div class="section-title">${ph?`Phase ${ph.number} · ${esc(ph.name)} — Step ${stepNo} of ${inPhase.length}`:'Preconstruction Complete'}</div>${overdue?`<span class="chip bad" style="margin-top:8px">${Math.abs(daysBetween(cs.dueDate,today()))} DAYS OVERDUE</span>`:''}<h2>${esc(cs?.title||'Ready for Production')}</h2><div class="muted small">${esc(cs?.role||'All phases complete')}</div>${cs?`<div class="split" style="margin-top:14px"><div class="field"><label>Assigned To</label><select onchange="overrideAssignee('${cs.id}',this.value)"><option value="">Unassigned</option>${people().map(n=>`<option ${assigned===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Baseline Was</label><input value="${fmt(cs.baselineDate)}" disabled></div></div>${tpl?.step.needsMeeting?`<div class="meeting-banner">📅 Meeting Needed · ${esc((tpl.step.meetingWith||[]).join(', ')||'Attendees not yet set')}</div>`:''}<div style="margin-top:14px">${notesEditor(cs)}</div><div class="workflow-nav" style="margin-top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" onclick="goBackStep()" ${p.projectSteps.findIndex(x=>x.id===cs.id)===0?'disabled':''}>← Back One Step</button>${cs.status==='not_started'?`<button class="btn" onclick="startCurrentStep()">Start Step</button>`:''}<button class="btn dark" onclick="advanceCurrentStep()">Complete & Advance →</button>${tpl?.step.canRevise?`<button class="btn" onclick="sendCurrentStepForRevision()" ${!tpl.step.revisesStepId?'disabled title="Set the revision return step in Company Settings first"':''}>↩ Send Back for Revision</button>`:''}<span class="small muted">${p.projectSteps.findIndex(x=>x.id===cs.id)+1} of ${p.projectSteps.length} total steps</span></div>`:''}</div><div class="task-pane">${taskPane(p)}</div></div>`:`<div class="hero-grid"><div class="hero-main"><div class="section-title">Before Anything Else</div><h2>Set the Baseline Schedule</h2><p class="muted small">Every deadline on this project depends on this being set first — nothing else starts until it is.</p><button class="btn dark" onclick="showBaselineModal()">Set Baseline Schedule</button></div><div class="task-pane">${taskPane(p)}</div></div>`;
 const banner=p.baselineReady?`<div class="baseline-banner"><div class="section-title">Baseline Schedule Active</div><div class="small">Original ready date <b>${fmt(p.baselineReady)}</b> · Current forecast <b>${fmt(forecastReady(p))}</b> · ${varianceLabel(p)}</div></div>`:`<div class="baseline-banner"><div class="section-title">No Baseline Schedule Set</div><div class="small">Nothing to measure against yet — the step below is the one required action right now.</div></div>`;
 return `${banner}<div class="phase-tracker">${phases}</div>${projectTeamPanel(p)}<div class="notice warning">△ Project status is driven by the step-by-step workflow below. Review the project against where it actually stands.</div>${hero}<section class="schedule-section"><div class="schedule-head"><div><div class="section-title">Preconstruction Schedule</div><p class="schedule-explain">This is the real schedule — driven by the same process every project runs through. The <b>Baseline</b> is the original plan and stays frozen. The <b>Forecast</b> moves with real completion dates. Use the full step list below to build ahead, adjust ownership, and manage due dates.</p></div><div class="row wrap"><button class="btn dark small" onclick="scrollToSteps()">📝 Build Schedule Manually</button><button class="btn small" onclick="generateBaselineFromToday()">📌 Auto-Generate Baseline</button><button class="btn small" onclick="window.print()">🖨 Print</button></div></div>${scheduleHealth(p)}${scheduleBars(p)}<div class="section-title" style="margin:18px 0 8px">Full Step List — Every Phase</div>${stepTable(p)}</section>`}
function notesEditor(s){const logs=[...(s.notes||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="section-title">Active-Step Notes</div><div class="row" style="margin-top:7px"><input class="input" id="active_note" placeholder="Log a note without overwriting prior history..."><button class="btn small" onclick="addStepNote('${s.id}')">+ Log Note</button></div><div class="note-log" style="margin-top:8px">${s.legacyNote?`<div class="note-item"><div class="note-meta">Earlier</div>${esc(s.legacyNote)}</div>`:''}${logs.map(n=>`<div class="note-item"><div class="row between"><div class="note-meta">${n.date?new Date(n.date).toLocaleString():'Earlier'} · ${esc(n.author||'Unknown')}</div><button class="btn icon small" onclick="deleteStepNote('${s.id}','${n.id}')">×</button></div>${esc(n.text)}</div>`).join('')}</div>`}
function addStepNote(id){const p=currentProject(),s=p.projectSteps.find(x=>x.id===id),el=document.getElementById('active_note');if(!el.value.trim())return;s.notes=s.notes||[];s.notes.push({id:uid(),text:el.value.trim(),date:new Date().toISOString(),author:state.loggedInName});save(false);renderProject()}

function overrideAssignee(id,val){const s=currentProject().projectSteps.find(x=>x.id===id);s.assignee=val;s.assigneeOverridden=true;save(false);renderProject()}
function resetAssignee(id){const s=currentProject().projectSteps.find(x=>x.id===id);s.assignee='';s.assigneeOverridden=false;save(false);renderProject()}
function showBaselineModal(isReset=false){const p=currentProject();const suggested=p.baselineStart||today();modal(`<h2>${p.baselineReady?'Reset':'Set'} Baseline Schedule</h2><p class="small muted">What date did preconstruction actually start? ALIGN will build the original baseline schedule forward from this date.</p><div class="field" style="margin-top:14px"><label>Preconstruction Start Date</label><input id="baseline_start_input" type="date" value="${suggested}"></div>${p.baselineReady?`<div class="notice warning" style="margin-top:12px">Resetting the baseline replaces the original planned dates used for variance tracking.</div>`:''}<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyBaselineStart()">${p.baselineReady?'Reset':'Set'} Baseline</button></div>`)}
function applyBaselineStart(){const p=currentProject();const start=document.getElementById('baseline_start_input')?.value;if(!start)return toast('Choose the preconstruction start date.');if(p.baselineReady&&!confirm('Reset the existing baseline using this start date? This replaces the original planned dates.'))return;generateBaseline(p,start);save(false);closeModal();renderProject();toast('Baseline schedule set from '+fmt(start));}
function generateBaselineFromToday(){showBaselineModal(!!currentProject()?.baselineReady)}
function extendCurrentPhase(){const p=currentProject();const n=Number(prompt('How many business days should the remaining schedule be extended from the current phase forward?', '3'));if(!n)return;const idx=p.projectSteps.findIndex(x=>x.status!=='done');for(let i=Math.max(0,idx);i<p.projectSteps.length;i++){const s=p.projectSteps[i];if(s.status!=='done'&&s.dueDate)s.dueDate=iso(shiftBusiness(parseDate(s.dueDate),n));}recalcForecast(p);save(false);renderProject()}
function scheduleHealth(p){const baseDays=p.baselineStart&&p.baselineReady?daysBetween(p.baselineStart,p.baselineReady):null;const foreReady=forecastReady(p);const foreDays=p.baselineStart&&foreReady?daysBetween(p.baselineStart,foreReady):null;const variance=scheduleVarianceDays(p);const forecastStart=computedForecastConstructionStart(p);const statusClass=variance>0?'schedule-behind':variance<0?'schedule-ahead':'schedule-on';const statusText=variance>0?`Behind schedule by ${variance} day${variance===1?'':'s'}`:variance<0?`Ahead of schedule by ${Math.abs(variance)} day${Math.abs(variance)===1?'':'s'}`:'On schedule';const active=currentStep(p);const detail=variance>0&&active?`${active.title} is currently tracking later than its frozen baseline date. Remaining forecast dates and the projected construction start move with this variance.`:variance<0&&active?`${active.title} is tracking ahead of its frozen baseline. Remaining forecast dates and the projected construction start have moved forward.`:'Forecast currently matches the frozen baseline.';return `<div class="schedule-status-banner ${statusClass}"><div><b>${statusText}</b><span>${esc(detail)}</span></div><div class="schedule-status-number">${variance===0?'0':variance>0?`+${variance}`:`${variance}`}<small>days</small></div></div><div class="schedule-health"><div class="health-box"><label>Original Target Start</label><input type="date" value="${p.targetStart||''}" onchange="setProjectField('targetStart',this.value)"></div><div class="health-box ${variance>0?'health-behind':variance<0?'health-ahead':''}"><label>Forecast Construction Start</label><strong>${fmt(forecastStart)}</strong><span class="tiny muted">Moves automatically with schedule variance</span></div><div class="health-box"><label>Baseline Ready</label><strong>${fmt(p.baselineReady)}</strong></div><div class="health-box ${variance>0?'health-behind':variance<0?'health-ahead':''}"><label>Forecast Ready</label><strong>${fmt(foreReady)}</strong></div><div class="health-box"><label>Total Baseline Days</label><strong>${baseDays??'—'}</strong></div><div class="health-box"><label>Total Forecast Days</label><strong>${foreDays??'—'}</strong></div><div class="health-box ${variance>0?'health-behind':variance<0?'health-ahead':''}"><label>Variance</label><strong>${esc(varianceLabel(p))}</strong></div></div><div class="row" style="margin-bottom:10px"><button class="btn small" onclick="extendCurrentPhase()">Extend Current Phase</button><button class="btn small danger" onclick="showBaselineModal(true)">Reset Baseline</button></div>`}
function scheduleBars(p){
 const phases=sortedPhases();
 const dates=[];
 phases.forEach(ph=>projectStepsFor(p,ph.number).forEach(st=>{if(st.baselineDate)dates.push(parseDate(st.baselineDate));if(st.dueDate)dates.push(parseDate(st.dueDate));if(st.completedDate)dates.push(parseDate(st.completedDate))}));
 if(!dates.length)return `<div class="notice">Set a baseline to populate the phase Gantt chart.</div>`;
 let min=new Date(Math.min(...dates.map(d=>d.getTime()))),max=new Date(Math.max(...dates.map(d=>d.getTime())));
 min.setHours(12,0,0,0);max.setHours(12,0,0,0);min.setDate(min.getDate()-2);max.setDate(max.getDate()+2);
 const days=[];for(let d=new Date(min);d<=max;d.setDate(d.getDate()+1))days.push(new Date(d));
 const dayMs=86400000,total=Math.max(1,days.length),pctDate=d=>{const x=parseDate(d);x.setHours(12,0,0,0);return Math.max(0,Math.min(100,((x-min)/dayMs)/total*100))};
 const barWidth=(start,end)=>{if(!start||!end)return 0;const a=parseDate(start),b=parseDate(end);a.setHours(12,0,0,0);b.setHours(12,0,0,0);return Math.max(100/total,(((b-a)/dayMs)+1)/total*100)};
 const todayPct=pctDate(today());
 const grid=`220px repeat(${total},34px)`;
 const axis=`<div class="gantt-axis" style="grid-template-columns:${grid}"><div>Phase</div>${days.map(d=>`<div class="gantt-day ${d.getDay()===0||d.getDay()===6?'weekend':''}"><div class="dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}</div><div class="md">${d.getMonth()+1}/${d.getDate()}</div></div>`).join('')}</div>`;
 const bg=days.map((d,i)=>{const left=i/total*100,w=100/total;return `${d.getDay()===0||d.getDay()===6?`<div class="gantt-weekend" style="left:${left}%;width:${w}%"></div>`:''}<div class="gantt-dayline" style="left:${left}%"></div>`}).join('');
 const rows=phases.map(ph=>{const arr=projectStepsFor(p,ph.number),b=arr.filter(x=>x.baselineDate),f=arr.filter(x=>x.dueDate||x.completedDate);if(!arr.length)return'';const b0=b[0]?.baselineDate,b1=b[b.length-1]?.baselineDate;const f0=(f[0]?.completedDate||f[0]?.dueDate||b0),f1=(f[f.length-1]?.completedDate||f[f.length-1]?.dueDate||b1);const done=arr.length?arr.filter(x=>x.status==='done').length/arr.length:0;const leftB=b0?pctDate(b0):0,widthB=b1?barWidth(b0,b1):100/total,leftF=f0?pctDate(f0):leftB,widthF=f1?barWidth(f0,f1):widthB;return `<div class="gantt-row" style="grid-template-columns:${grid}"><button type="button" class="gantt-label" onclick="showPhaseSteps(${ph.number})" title="View steps in this phase" style="grid-column:1">Phase ${ph.number} · ${esc(ph.name)}</button><div class="gantt-track" style="grid-column:2 / span ${total}">${bg}<div class="gantt-today" style="left:${todayPct}%"></div><div class="gantt-baseline" style="left:${leftB}%;width:${widthB}%"></div><div class="gantt-forecast" style="left:${leftF}%;width:${widthF}%"></div><div class="gantt-complete" style="left:${leftF}%;width:${widthF*done}%"></div></div></div>`}).join('');
 return `<div class="gantt-legend"><span><i class="legend-swatch legend-baseline"></i>Baseline</span><span><i class="legend-swatch legend-forecast"></i>Forecast</span><span><i class="legend-swatch legend-complete"></i>Completed progress</span><span><i class="legend-weekend"></i>Weekend</span><span style="color:var(--rust)">│ Today</span></div><div class="gantt"><div class="gantt-inner">${axis}${rows}</div></div>`;
}
function showPhaseSteps(phaseNumber){const p=currentProject(),ph=phaseByNumber(phaseNumber),steps=projectStepsFor(p,phaseNumber);if(!ph)return;modal(`<div class="row between"><div><div class="section-title">Phase ${ph.number}</div><h2 style="margin:4px 0 2px">${esc(ph.name)}</h2><div class="small muted">${steps.length} step${steps.length===1?'':'s'} in this phase</div></div></div><div style="margin-top:14px">${steps.map((st,i)=>{const ass=resolveAssignee(st);const status=st.status==='done'?'Complete':st.status==='working'?'In Progress':'Not Started';return `<div class="note-item" style="margin-bottom:8px"><div class="row between" style="gap:12px"><div><b>${i+1}. ${esc(st.title)}</b><div class="tiny muted" style="margin-top:3px">${esc(st.role||'')} · ${esc(ass||'Unassigned')}</div></div><span class="chip ${st.status==='done'?'good':st.status==='working'?'warn':''}">${status}</span></div><div class="tiny muted" style="margin-top:7px">Baseline ${fmt(st.baselineDate)} · Forecast ${fmt(st.dueDate)}</div></div>`}).join('')}</div><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Done</button></div>`)}
function stepTable(p){return `<div class="step-table"><div class="step-row header"><div></div><div>Step</div><div>Assigned To</div><div>Due Date</div><div>Baseline</div><div>Actions</div></div>${p.projectSteps.map((s,i)=>{const cur=currentStep(p)?.id===s.id;const ass=resolveAssignee(s);return `<div class="step-row ${cur?'current':''} ${s.status==='done'?'done':''}"><button class="status-dot ${s.status}" title="Cycle status" onclick="cycleStep('${s.id}')"></button><div><b>${esc(s.title)}</b><div class="tiny muted">Phase ${s.phaseNumber} · ${esc(s.role)}</div></div><select class="input" onchange="overrideAssignee('${s.id}',this.value)"><option value="">Unassigned</option>${people().map(n=>`<option ${ass===n?'selected':''}>${esc(n)}</option>`).join('')}</select><input class="input" type="date" value="${s.dueDate||''}" onchange="setStepDue('${s.id}',this.value)"><div class="small">${fmt(s.baselineDate)}</div><div class="row wrap"><button class="btn small" onclick="resetAssignee('${s.id}')">Use Default</button>${cur?`<button class="btn dark small" onclick="advanceCurrentStep()">Complete & Next →</button>`:s.status==='done'?`<button class="btn small" onclick="cycleStep('${s.id}')">↩ Return Here</button>`:`<span class="tiny muted">Locked until prior step is complete</span>`}</div></div>`}).join('')}</div>`}
function startCurrentStep(){const p=currentProject(),s=currentStep(p);if(!s)return;s.status='working';s.startedDate=s.startedDate||today();save(false);renderProject()}
function advanceCurrentStep(){const p=currentProject(),s=currentStep(p);if(!s)return;const i=p.projectSteps.findIndex(x=>x.id===s.id);const finished=today();const scheduled=s.dueDate||s.baselineDate;const shift=scheduled?businessDaysBetween(scheduled,finished):0;s.status='done';s.completedDate=finished;s.startedDate=s.startedDate||finished;if(shift!==0){for(let j=i+1;j<p.projectSteps.length;j++){const future=p.projectSteps[j];if(future.status!=='done'&&future.dueDate)future.dueDate=iso(shiftBusiness(parseDate(future.dueDate),shift));}}const next=p.projectSteps[i+1];if(next){next.status='working';next.startedDate=next.startedDate||finished;}recomputeProjectPhase(p);recalcForecast(p);save(false);renderProject();const movement=shift<0?` Schedule pulled forward ${Math.abs(shift)} business day${Math.abs(shift)===1?'':'s'}.`:shift>0?` Schedule moved back ${shift} business day${shift===1?'':'s'}.`:'';toast(next?`Advanced to: ${next.title}.${movement}`:`Preconstruction complete.${movement}`)}
function goBackStep(){const p=currentProject();let s=currentStep(p),i=s?p.projectSteps.findIndex(x=>x.id===s.id):p.projectSteps.length;if(i<=0)return toast('This is the first step');const prev=p.projectSteps[i-1];if(s){s.status='not_started';s.startedDate='';s.completedDate='';}prev.status='working';prev.completedDate='';prev.startedDate=prev.startedDate||today();for(let j=i+1;j<p.projectSteps.length;j++){if(p.projectSteps[j].status!=='done')continue;p.projectSteps[j].status='not_started';p.projectSteps[j].completedDate='';p.projectSteps[j].startedDate='';}recomputeProjectPhase(p);recalcForecast(p);save(false);renderProject();toast(`Moved back to: ${prev.title}`)}
function cycleStep(id){const p=currentProject(),s=p.projectSteps.find(x=>x.id===id),cur=currentStep(p);if(!s)return;if(cur&&s.id===cur.id){if(s.status==='not_started')startCurrentStep();else advanceCurrentStep();return}const idx=p.projectSteps.findIndex(x=>x.id===id),curIdx=cur?p.projectSteps.findIndex(x=>x.id===cur.id):p.projectSteps.length;if(idx<curIdx){if(!confirm(`Move the workflow back to "${s.title}"? Steps after it will be reopened as needed.`))return;for(let j=idx;j<p.projectSteps.length;j++){p.projectSteps[j].status=j===idx?'working':'not_started';p.projectSteps[j].completedDate='';if(j!==idx)p.projectSteps[j].startedDate='';}s.startedDate=s.startedDate||today();recomputeProjectPhase(p);recalcForecast(p);save(false);renderProject();return}toast('Finish the current step before moving ahead.')}
function setStepDue(id,val){const p=currentProject(),s=p.projectSteps.find(x=>x.id===id);s.dueDate=val;recalcForecast(p);save(false);renderProject()}

function taskPane(p){const filters=['open','not_started','working','done','all'];p._taskFilter=p._taskFilter||'open';const counts={open:p.tasks.filter(t=>t.status!=='done').length,not_started:p.tasks.filter(t=>t.status==='not_started').length,working:p.tasks.filter(t=>t.status==='working').length,done:p.tasks.filter(t=>t.status==='done').length,all:p.tasks.length};const shown=p._taskFilter==='all'?p.tasks:p._taskFilter==='open'?p.tasks.filter(t=>t.status!=='done'):p.tasks.filter(t=>t.status===p._taskFilter);return `<div class="row between"><div class="section-title">Tasks</div><button class="btn small" onclick="showTaskModal()">+ Add Task</button></div><div class="row wrap" style="margin:9px 0">${filters.map(f=>`<button class="chip ${p._taskFilter===f?'good':''}" style="border:0;cursor:pointer" onclick="setTaskFilter('${f}')">${f.replace('_',' ')} (${counts[f]})</button>`).join('')}</div>${shown.length?shown.map(t=>`<div class="task-compact"><button class="task-circle ${t.status}" onclick="cycleTask('${t.id}')"></button><div style="flex:1" onclick="showTaskModal('${t.id}')"><b class="small">${esc(t.title)}</b><div class="tiny muted">${t.dueDate?fmt(t.dueDate):''}${t.assignee?` · ${esc(t.assignee)}`:''}</div></div></div>`).join(''):`<div class="empty">${p._taskFilter==='open'?'No open tasks.':'No tasks in this view.'}</div>`}`}

function clarificationsTab(p){

 const rid=p._activeClarRound||p.clarificationRounds[0].id;const round=p.clarificationRounds.find(r=>r.id===rid)||p.clarificationRounds[0];const rows=p.clarifications.filter(c=>(c.roundId||'round1')===round.id);const open=rows.filter(c=>!String(c.response||'').trim()).length;

 const html=`<!doctype html><html><head><meta charset="utf-8"><title>${safe(p.name)} - ${safe(round.name)} Clarifications</title><style>

ing:.12em;text-transform:uppercase;margin-bottom:4px}.block{padding:12px}.block.response{background:#fbfaf7;border-top:1px solid #e7e3dc}.empty-report{padding:28px;border:1px solid #ddd9d0;border-radius:8px;text-align:center;color:#77736b}.footer{margin-top:24px;padding-top:10px;border-top:1px solid #d9d5cd;display:flex;justify-content:space-between;color:#77736b;font-size:8px}.screen-actions{max-width:8.1in;margin:14px auto 0;padding:0 .55in;display:flex;justify-content:flex-end;gap:8px}.screen-actions button{border:1px solid #d7d3cc;background:#fff;border-radius:7px;padding:8px 12px}.screen-actions button.primary{background:#4b4840;color:#fff;border-color:#4b4840}@media print{.screen-actions{display:none!important}.page{padding:.25in .35in}@page{size:letter;margin:.35in}.clar-card{break-inside:avoid}}

 </style></head><body><div class="screen-actions"><button onclick="window.close()">Close</button><button class="primary" onclick="window.print()">Print / Save as PDF</button></div><main class="page"><header class="brand"><div>${logo?`<img class="brand-logo" src="${logo}" alt="${safe(state.company?.name||'Mitchell Construction & Design')}">`:`<div class="brand-fallback">${safe(state.company?.name||'Mitchell Construction & Design')}</div>`}</div><div class="align-mark">ALIGN<small>PROJECT CLARIFICATION REPORT</small></div></header><div class="kicker">Project Workspace</div><h1 class="title">${safe(p.name)}</h1><div class="subtitle">${safe(p.client||'')}${p.location?' · '+safe(p.location):''} · ${safe(round.name)} · ${safe(round.audience||'Client')}</div><div class="summary"><div><strong>Clarification Round</strong><div>${safe(round.name)}</div></div><div><strong>Total Items</strong><div>${rows.length}</div></div><div><strong>Open Items</strong><div class="open-count">${open}</div></div><div><strong>Report Date</strong><div>${safe(reportDate)}</div></div></div>${items}<footer class="footer"><span>ALIGN · ${safe(state.company?.name||'Mitchell Construction & Design')}</span><span>${safe(reportDate)}</span></footer></main></body></html>`;
 const w=window.open('about:blank','_blank');
 if(!w){toast('Pop-up blocked. Allow pop-ups for ALIGN, then try Print / PDF again.');return;}
 try{
   w.document.open();
   w.document.write(html);
   w.document.close();
   setTimeout(()=>{try{w.focus()}catch(e){}},150);

function sheetIdFromUrl(url){const m=String(url||'').match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:''}

function plansTab(p){
 p.planTags=p.planTags||['Architectural','Structural','Electrical','Plumbing','Mechanical','Site Plan','Elevations','Other'];const active=p._planFilter||'All';const shown=active==='All'?p.plans:p.plans.filter(f=>(f.tags||[]).includes(active));
 return `<div class="section-title">GoVisually Project</div><div class="flat-card govisual-card"><p class="workspace-intro" style="margin-top:0">Plans, renders, and markups for tests live in GoVisually while they're in progress — paste the project link below once, and it'll open straight there from here.</p><div class="field"><label>GoVisually Project Link</label><div class="govisual-link-row"><input class="input" placeholder="https://app.govisually.com/..." value="${esc(p.goVisuallyLink||'')}" onchange="setProjectField('goVisuallyLink',this.value)">${p.goVisuallyLink?`<button class="btn small" onclick="window.open('${esc(p.goVisuallyLink)}','_blank')">Open ↗</button>`:''}</div></div><div class="tagbar"><span class="tagbtn">${p.goVisuallyLink?'Link saved':'No link saved yet'}</span></div></div><div class="section-title plans-section-title">Finalized Plans & Drawings</div><p class="workspace-intro">Approved, finished sheets only — architectural, structural, electrical, whatever's actually done. Work in progress, markups, and review cycles stay in GoVisually above; this is the record copy once it's final.</p><div class="plans-upload-row"><div class="tagbar"><button class="tagbtn ${active==='All'?'active':''}" onclick="setPlanFilter('All')">All</button>${p.planTags.map(t=>`<button class="tagbtn ${active===t?'active':''}" onclick="setPlanFilter('${esc(t)}')">${esc(t)}</button>`).join('')}</div><div class="row"><button class="tagbtn" onclick="manageProjectTags('planTags')">⚙ Manage Tags</button><button class="btn primary small" onclick="showUploadModal('plans')">+ Upload</button></div></div>${taggedFileList(shown,'plans')}`}
function setPlanFilter(t){currentProject()._planFilter=t;renderProject()}
function filesTab(p){p.fileTags=p.fileTags||['Design Discovery Form','Inspiration Photos','Reading Material','Notes','Other'];const active=p._fileFilter||'All';const shown=active==='All'?p.files:p.files.filter(f=>(f.tags||[]).includes(active));return `<p class="workspace-intro">General documents and photos for this project — the Design Discovery form, inspiration photos, reading material the client sent, loose notes. Plans and renderings live on the Plans & Design tab instead, not here.</p><div class="file-filter-head"><div class="tagbar"><button class="tagbtn ${active==='All'?'active':''}" onclick="setFileFilter('All')">All</button>${p.fileTags.map(t=>`<button class="tagbtn ${active===t?'active':''}" onclick="setFileFilter('${esc(t)}')">${esc(t)}</button>`).join('')}</div><div class="row"><button class="tagbtn" onclick="manageProjectTags('fileTags')">⚙ Manage Tags</button><button class="btn primary small" onclick="showUploadModal('files')">+ Upload</button></div></div>${taggedFileList(shown,'files')}`}

function fileCardPreview(f,type){const mime=(f.mime||'').toLowerCase(),data=f.data||'';if(mime.startsWith('image/')||data.startsWith('data:image/'))return `<img src="${f.data}" alt="${esc(f.title||f.name||'File preview')}">`;if(mime.includes('pdf')||data.startsWith('data:application/pdf'))return `<iframe src="${f.data}#toolbar=0&navpanes=0&scrollbar=0" title="${esc(f.title||f.name||'PDF preview')}"></iframe>`;const parts=(f.name||'').split('.'),ext=(parts.length>1?parts.pop():'FILE').toUpperCase();return `<div class="file-icon">📄<div class="tiny" style="text-align:center;margin-top:5px">${esc(ext)}</div></div>`}
function taggedFileList(arr,type){return arr.length?`<div class="file-grid-list">${arr.map(f=>`<div class="file-card"><div class="file-card-preview" onclick="previewData('${f.id}','${type}')">${fileCardPreview(f,type)}</div><div class="file-card-body"><div><div class="file-card-title" title="${esc(f.title||f.name)}">${esc(f.title||f.name)}</div><div class="file-card-meta">${esc(f.uploadedBy||'')} · ${f.uploadedAt?new Date(f.uploadedAt).toLocaleDateString():''}</div></div><div class="file-tags">${(f.tags||[]).map(t=>`<span class="filetag">${esc(t)}</span>`).join('')}</div><div class="file-card-name" title="${esc(f.name||'')}">${esc(f.name||'')}</div><div class="file-card-actions"><button class="btn small" onclick="previewData('${f.id}','${type}')">View</button><button class="btn small" onclick="editFileTags('${type}','${f.id}')">Tag</button><button class="btn small danger" style="margin-left:auto" onclick="removeProjectFile('${type}','${f.id}')">×</button></div></div></div>`).join('')}</div>`:`<div class="empty">No ${type==='plans'?'finalized plans or drawings':'files'} uploaded yet.</div>`}
function manageProjectTags(key){const p=currentProject(),tags=p[key]||[];modal(`<h2>Manage Tags</h2><div id="tag_manage_list">${tags.map((t,i)=>`<div class="row" style="margin:7px 0"><input class="input" value="${esc(t)}" onchange="renameProjectTag('${key}',${i},this.value)"><button class="btn small danger" onclick="deleteProjectTag('${key}',${i})">×</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><input class="input" id="new_tag_name" placeholder="New tag"><button class="btn" onclick="addProjectTag('${key}')">+ Add</button></div><div class="modal-actions"><button class="btn primary" onclick="closeModal();renderProject()">Done</button></div>`)}
function addProjectTag(key){const v=document.getElementById('new_tag_name').value.trim(),p=currentProject();if(!v)return;if(!p[key].includes(v))p[key].push(v);save(false);manageProjectTags(key)}
function renameProjectTag(key,i,v){const p=currentProject(),old=p[key][i],nv=v.trim();if(!nv)return;p[key][i]=nv;const type=key==='planTags'?'plans':'files';p[type].forEach(f=>f.tags=(f.tags||[]).map(t=>t===old?nv:t));save(false)}
function deleteProjectTag(key,i){const p=currentProject(),old=p[key][i];if(!confirm(`Delete tag "${old}"? Files will remain.`))return;p[key].splice(i,1);const type=key==='planTags'?'plans':'files';p[type].forEach(f=>f.tags=(f.tags||[]).filter(t=>t!==old));save(false);manageProjectTags(key)}
function editFileTags(type,id){const p=currentProject(),f=p[type].find(x=>x.id===id),tags=type==='plans'?p.planTags:p.fileTags;modal(`<h2>Tag File</h2><p><b>${esc(f.title||f.name)}</b></p><div class="tag-check-grid">${tags.map(t=>`<button class="tag-check ${(f.tags||[]).includes(t)?'selected':''}" onclick="toggleFileTag('${type}','${id}','${esc(t)}',this)">${esc(t)}</button>`).join('')}</div><div class="modal-actions"><button class="btn primary" onclick="closeModal();renderProject()">Done</button></div>`)}
function toggleFileTag(type,id,tag,el){const f=currentProject()[type].find(x=>x.id===id);f.tags=f.tags||[];f.tags=f.tags.includes(tag)?f.tags.filter(t=>t!==tag):[...f.tags,tag];el.classList.toggle('selected');save(false)}
function showUploadModal(type){const p=currentProject(),tags=type==='plans'?p.planTags:p.fileTags;modal(`<h2>Upload ${type==='plans'?'Plans / Drawings':'Files'}</h2><div class="field"><label>Files</label><input id="up_files" type="file" multiple></div><div class="field" style="margin-top:10px"><label>Title (optional)</label><input id="up_title" placeholder="Defaults to file name"></div><div class="field" style="margin-top:10px"><label>Tags — choose as many as apply</label><div class="tag-check-grid">${tags.map(t=>`<button type="button" class="tag-check" data-upload-tag="${esc(t)}" onclick="this.classList.toggle('selected')">${esc(t)}</button>`).join('')}</div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="processUpload('${type}')">Upload</button></div>`)}
async function processUpload(type){const input=document.getElementById('up_files'),files=[...input.files];if(!files.length)return toast('Choose at least one file');const title=document.getElementById('up_title').value.trim(),tags=[...document.querySelectorAll('[data-upload-tag].selected')].map(x=>x.dataset.uploadTag),arr=currentProject()[type];for(let i=0;i<files.length;i++){const f=files[i],data=await readFile(f);arr.push({id:uid(),name:f.name,title:title?(files.length>1?`${title} (${i+1})`:title):f.name,tags:[...tags],category:tags[0]||'Other',mime:f.type||'application/octet-stream',data,uploadedBy:state.loggedInName,uploadedAt:new Date().toISOString()})}save(false);closeModal();renderProject()}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}

function clientPhaseRanges(p){
 const phases=sortedPhases();
 return phases.map(ph=>{const arr=projectStepsFor(p,ph.number);const dates=arr.flatMap(st=>[st.baselineDate,st.dueDate,st.completedDate].filter(Boolean));const start=arr.find(st=>st.baselineDate||st.dueDate||st.completedDate);const end=[...arr].reverse().find(st=>st.completedDate||st.dueDate||st.baselineDate);const startDate=start?(start.baselineDate||start.dueDate||start.completedDate):'';const endDate=end?(end.completedDate||end.dueDate||end.baselineDate):'';const working=arr.reduce((n,st)=>n+(Number((allTemplateSteps().find(x=>x.step.id===st.templateStepId)?.step.duration)||0)),0);const done=arr.length?arr.filter(st=>st.status==='done').length/arr.length:0;return {ph,arr,startDate,endDate,working,done}})
}
function clientScheduleVisual(p){
 const rows=clientPhaseRanges(p),valid=rows.flatMap(r=>[r.startDate,r.endDate].filter(Boolean)).map(parseDate);
 if(!valid.length)return `<div class="notice">The client schedule will appear after the baseline schedule is set.</div>`;
 let min=new Date(Math.min(...valid.map(d=>d.getTime()))),max=new Date(Math.max(...valid.map(d=>d.getTime())));min.setDate(min.getDate()-2);max.setDate(max.getDate()+2);if(max-min<35*86400000)max.setDate(min.getDate()+35);const span=Math.max(1,max-min);const pct=d=>Math.max(0,Math.min(100,((parseDate(d)-min)/span)*100));const axis=Array.from({length:7},(_,i)=>{const d=new Date(min.getTime()+span*i/6);return {p:(i/6)*100,l:d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}});const tp=pct(today());
 return `<div class="client-schedule"><div class="client-schedule-inner"><div class="client-schedule-axis"><div class="client-axis-label">Full Schedule</div><div class="client-timeline-axis">${axis.map(a=>`<span class="axis-date" style="left:${a.p}%">${a.l}</span>`).join('')}<div class="client-today-line" style="left:${tp}%"></div></div><div></div></div>${rows.map(r=>{const left=r.startDate?pct(r.startDate):0,w=r.endDate?Math.max(1,pct(r.endDate)-left):1;const cls=r.done>=1?'done':p.currentPhase===r.ph.number?'current':'';return `<div class="client-sched-row"><div class="client-sched-label">Phase ${r.ph.number} · ${esc(r.ph.name)}<small>${r.working||'—'} working days scheduled</small></div><div class="client-sched-track"><div class="client-today-line" style="left:${tp}%"></div>${r.startDate?`<div class="client-sched-bar ${cls}" style="left:${left}%;width:${w}%"></div>`:''}</div><div class="client-date-range">${r.startDate?`${fmt(r.startDate)} → ${fmt(r.endDate)}`:'Dates not set'}</div></div>`}).join('')}</div></div><div class="gantt-legend"><span><i class="legend-swatch legend-baseline"></i>Target</span><span><i class="legend-swatch legend-forecast"></i>Current phase</span><span><i class="legend-swatch legend-complete"></i>Complete</span><span style="color:var(--rust)">│ Today</span></div>`

async function copyEmailEmbed(){
 const p=currentProject(),html=emailEmbedHtml(p),text=clientEmailPlainText(p);
 // Selection-based copy is intentionally first. Gmail/Outlook recognize this as rendered rich HTML,
 // while copying an HTML source string would paste code into the message body.
 const holder=document.createElement('div');
 holder.setAttribute('contenteditable','true');
 holder.setAttribute('aria-hidden','true');
 holder.style.cssText='position:fixed;left:-10000px;top:0;width:760px;background:#fff;opacity:.01;pointer-events:none;';
 holder.innerHTML=html;
 document.body.appendChild(holder);
 let copied=false;
 try{
  const range=document.createRange();range.selectNodeContents(holder);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  copied=document.execCommand('copy');
  sel.removeAllRanges();
 }catch(e){}
 holder.remove();
 if(copied){toast('Client update copied — paste directly into Gmail or Outlook.');return;}
 try{
  if(navigator.clipboard&&window.ClipboardItem){
   await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);
   toast('Client update copied — paste directly into Gmail or Outlook.');return;
  }
 }catch(e){}
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('Rich copy was blocked, so the clean text version was copied instead.');return}}catch(e){} if(copyTextFallback(text)){toast('Clean text email update copied');return} previewEmailEmbed();toast('Automatic copy was blocked. The preview is open so you can select and copy it manually.')
}

function projectContactById(id){return (state.company.projectContacts||[]).find(c=>c.id===id)}
