 if(!session){renderLogin();return}
 authUser=session.user;await bootAuthenticated();
}

const ACTUAL_PROCESS_VERSION=2;
const ACTUAL_STEP_TITLES=[
 ['Design Discovery Form Sent','Discovery Form & Creative Brief Completed','Internal Review of Discovery & Brief','Design Discovery / Client Review Meeting'],
 ['Architectural Development Started','First-Round Rough Draft of Plans','Internal Plan Review','First-Round Client Plan Review','Selection Takeoffs & Identification'],
 ['Design Direction & Intent Meeting','Design Direction Established','Major Product Selections In Progress','Major Selections Complete'],
 ['Begin 3D Renderings','Internal Rendering Review','Client Rendering Review','Final Architectural Plan Details','Final Internal Review','Final Client Review'],
 ['Trade / Subcontractor Pricing','Formal Project Budget Created','Internal Review of Formal Proposal','Formal Proposal Presented to Client'],
 ['Construction Agreement Sent','Construction Contract Signed','Final Scheduling Phase','Project Handoff / Production Setup']
];
function applyActualProcessMigration(){
 if((state.company.actualProcessVersion||0)>=ACTUAL_PROCESS_VERSION)return;
 const fresh=defaultState().company.phases;
 const oldPhases=[...(state.company.phases||[])].sort((a,b)=>a.number-b.number);
 // Keep each phase's identity, color, client description and number where possible, but replace the checklist with the approved real steps.
 state.company.phases=fresh.map((np,pi)=>{
   const old=oldPhases[pi];
   return {...np,id:old?.id||np.id,number:old?.number??np.number,name:np.name,color:old?.color||np.color,description:old?.description||np.description};
 });
 // Existing projects are migrated by phase + step position so notes/dates/statuses are not thrown away during this prototype update.
 (state.projects||[]).forEach(project=>{
   const oldSteps=project.projectSteps||[];
   const migrated=[];
   state.company.phases.forEach((ph,pi)=>{
     const prior=oldSteps.filter(x=>Number(x.phaseNumber)===Number(ph.number));
     ph.steps.forEach((ts,si)=>{
       const os=prior[si];
       migrated.push({
         id:os?.id||uid(),templateStepId:ts.id,phaseNumber:ph.number,title:ts.title,role:ts.role,
         status:os?.status||'not_started',assignee:os?.assignee||'',assigneeOverridden:!!os?.assigneeOverridden,
         dueDate:os?.dueDate||'',baselineDate:os?.baselineDate||'',completedDate:os?.completedDate||'',
         startedAt:os?.startedAt||'',notes:Array.isArray(os?.notes)?os.notes:[],files:Array.isArray(os?.files)?os.files:[]
       });
     });
   });
   project.projectSteps=migrated;
   recomputeProjectPhase(project);
 });
 state.company.actualProcessVersion=ACTUAL_PROCESS_VERSION;
}
function migrate(){
 if(!state.company)state=defaultState();
 state.company.projectContacts=state.company.projectContacts||[];
 state.company.estimateTemplate=state.company.estimateTemplate||{name:'MCD_Estimation_Dashboard',url:'https://docs.google.com/spreadsheets/d/1xBPJsJSKbo56QQEchhdlUV0wS2qNo-uTOZF0rCxGkfE/edit?usp=drivesdk'};
 state.company.phases=(state.company.phases||[]).sort((a,b)=>a.number-b.number);
 state.projects=state.projects||[];
 state.projects.forEach(p=>{p.architectId=p.architectId||'';p.designerId=p.designerId||'';p.estimateSheetUrl=p.estimateSheetUrl||'';p.estimateSheetName=p.estimateSheetName||'';p.tasks=p.tasks||[];p.clarifications=p.clarifications||[];p.plans=p.plans||[];p.files=p.files||[];p.meetingNotes=p.meetingNotes||[];p.clientUpdates=p.clientUpdates||[];p.inspiration=p.inspiration||[];p.documents=p.documents||{};p.documentSlots=p.documentSlots||[{id:'preliminary',key:'preliminary',label:'Preliminary Proposal'},{id:'formal',key:'formal',label:'Formal Proposal'},{id:'agreement',key:'agreement',label:'Construction Agreement'}];p.projectSteps=p.projectSteps||seedProjectSteps();p.fileTags=p.fileTags||['Design Discovery Form','Inspiration Photos','Reading Material','Notes','Other'];p.planTags=p.planTags||['Architectural','Structural','Electrical','Plumbing','Mechanical','Site Plan','Elevations','Other'];p.meetingTags=p.meetingTags||['Client Meeting','Internal','Site Visit','Design Review','Subcontractor'];p.clarificationRounds=p.clarificationRounds||[{id:'round1',name:'1st Round',audience:'Client'}];p.goVisuallyLink=p.goVisuallyLink||'';p.files.forEach(f=>{f.tags=f.tags||[f.category||'Other']});p.plans.forEach(f=>{f.tags=f.tags||[f.category||'Other']});p.meetingNotes.forEach(n=>{n.tags=n.tags||[n.type||'Internal'];n.title=n.title||n.type||'Meeting Note';n.html=n.html||esc(n.notes||'')});p.clarifications.forEach(c=>{c.roundId=c.roundId||'round1';c.date=c.date||today();c.location=c.location||'';c.trade=c.trade||'';c.markedBy=c.markedBy||'';});});
}
function save(msg=true){state.lastSaved=new Date().toISOString();scheduleRemoteSave();if(msg)toast('Saved');}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1700)}
function activeUsers(){return (state.company.users||[]).filter(u=>u.status==='Active').map(u=>u.name)}
function people(){return [...activeUsers(),...(state.company.externalContacts||[])];}
function allTemplateSteps(){return state.company.phases.flatMap(p=>p.steps.map((s,i)=>({phase:p,index:i,step:s})))}
function seedProjectSteps(){return allTemplateSteps().map(x=>({id:uid(),templateStepId:x.step.id,phaseNumber:x.phase.number,title:x.step.title,role:x.step.role,status:'not_started',assignee:'',assigneeOverridden:false,dueDate:'',baselineDate:'',notes:[],files:[]}));}
function currentProject(){return state.projects.find(p=>p.id===state.currentProjectId)}
function firstPhaseNumber(){return Math.min(...state.company.phases.map(p=>p.number))}
function phaseByNumber(n){return state.company.phases.find(p=>Number(p.number)===Number(n))}
function sortedPhases(){return [...state.company.phases].sort((a,b)=>a.number-b.number)}
function projectStepsFor(p,phaseNum){return p.projectSteps.filter(s=>Number(s.phaseNumber)===Number(phaseNum));}
function currentStep(p){return p.projectSteps.find(s=>s.status!=='done')||null}
function resolveAssignee(ps){if(ps.assigneeOverridden)return ps.assignee||'';const project=state.projects.find(p=>(p.projectSteps||[]).some(x=>x.id===ps.id));if(project&&ps.role==='Architect'){const c=projectContactById(project.architectId);if(c)return c.name}if(project&&ps.role==='Designer'){const c=projectContactById(project.designerId);if(c)return c.name}const list=state.company.roleAssignees[ps.role]||[];return list[0]||''}
function nextPhaseNumber(n){return sortedPhases().find(p=>p.number>Number(n))?.number||null}
function recomputeProjectPhase(p){const cs=currentStep(p);p.currentPhase=cs?cs.phaseNumber:null;}
function projectPercent(p){const total=p.projectSteps.length||1;return Math.round(p.projectSteps.filter(s=>s.status==='done').length/total*100)}
function phasePercent(p){if(!p.currentPhase)return 100;const arr=projectStepsFor(p,p.currentPhase);return arr.length?Math.round(arr.filter(s=>s.status==='done').length/arr.length*100):0}
function openTasks(p){return p.tasks.filter(t=>t.status!=='done').length}
function overdueTasks(p){const t=today();return p.tasks.filter(x=>x.status!=='done'&&x.dueDate&&x.dueDate<t).length}
function baselineReady(p){return p.baselineReady||''}
function scheduleVarianceDays(p){
 if(!p.baselineReady)return 0;
 const active=currentStep(p);
 // The active step is the clearest indicator of where the project actually sits versus the frozen baseline.
 // Use the later of its forecast due date or today so an overdue unfinished step keeps accruing delay.
 if(active&&active.baselineDate){
  let forecastPoint=active.dueDate||active.baselineDate;
  if(active.status!=='done'&&today()>forecastPoint)forecastPoint=today();
  return daysBetween(active.baselineDate,forecastPoint);
 }
 // If preconstruction is complete, compare the actual final completion to the frozen baseline-ready date.
 const completed=[...p.projectSteps].reverse().find(s=>s.completedDate);
 if(completed?.completedDate)return daysBetween(p.baselineReady,completed.completedDate);
 return 0;
}
function computedForecastReady(p){
 if(!p.baselineReady)return '';
 return iso(new Date(parseDate(p.baselineReady).getTime()+scheduleVarianceDays(p)*86400000));
}
function forecastReady(p){return computedForecastReady(p)||p.forecastReady||p.baselineReady||''}
function computedForecastConstructionStart(p){
 if(!p.targetStart)return forecastReady(p);
 return iso(new Date(parseDate(p.targetStart).getTime()+scheduleVarianceDays(p)*86400000));
}
function varianceLabel(p){if(!p.baselineReady)return 'No Baseline';const d=scheduleVarianceDays(p);if(d===0)return'On Schedule';return d>0?`${d}d behind`:`${Math.abs(d)}d ahead`}
function recalcForecast(p){if(!p.baselineStart||!p.baselineReady)return;p.forecastReady=computedForecastReady(p);p.forecastConstructionStart=computedForecastConstructionStart(p);}
function generateBaseline(p,start=today()){let cursor=parseDate(start);p.baselineStart=iso(cursor);for(const ph of sortedPhases()){for(const ts of ph.steps){const ps=p.projectSteps.find(x=>x.templateStepId===ts.id)||p.projectSteps.find(x=>x.phaseNumber===ph.number&&x.title===ts.title);if(!ps)continue;cursor=addBusiness(cursor,ts.duration||1);ps.baselineDate=iso(cursor);if(!ps.dueDate)ps.dueDate=ps.baselineDate;}}p.baselineReady=iso(cursor);p.forecastReady=p.baselineReady;p.forecastConstructionStart=p.forecastReady;p.baselineSetDate=today();save(false)}
function ensureProjectStepSync(p){const byTpl=new Map(p.projectSteps.map(x=>[x.templateStepId,x]));const fresh=[];for(const ph of sortedPhases()){for(const ts of ph.steps){let ps=byTpl.get(ts.id);if(!ps)ps={id:uid(),templateStepId:ts.id,phaseNumber:ph.number,title:ts.title,role:ts.role,status:'not_started',assignee:'',assigneeOverridden:false,dueDate:'',baselineDate:'',notes:[],files:[]};ps.phaseNumber=ph.number;ps.title=ts.title;ps.role=ts.role;fresh.push(ps)}}p.projectSteps=fresh;recomputeProjectPhase(p)}

function renderTaskCenter(){const f=taskCenterFilters(),all=allProjectTasks(),me=state.loggedInName||'';let rows=[...all];if(f.assignee==='__me__')rows=rows.filter(t=>t.assignee===me);else if(f.assignee!=='__all__')rows=rows.filter(t=>t.assignee===f.assignee);if(f.project!=='__all__')rows=rows.filter(t=>t.projectId===f.project);if(f.status==='open')rows=rows.filter(t=>t.status!=='done');else if(f.status!=='all')rows=rows.filter(t=>t.status===f.status);const q=(f.search||'').trim().toLowerCase();if(q)rows=rows.filter(t=>[t.title,t.projectName,t.client,t.assignee].some(v=>(v||'').toLowerCase().includes(q)));rows.sort((a,b)=>{const ad=a.dueDate||'9999-12-31',bd=b.dueDate||'9999-12-31';if(ad!==bd)return ad.localeCompare(bd);return (a.projectName||'').localeCompare(b.projectName||'')});const myOpen=all.filter(t=>t.assignee===me&&t.status!=='done').length,teamOpen=all.filter(t=>t.status!=='done').length,overdue=all.filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate<today()).length,dueSoon=all.filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate>=today()&&daysBetween(today(),t.dueDate)<=7).length;const assignees=[...new Set([...activeUsers(),...all.map(t=>t.assignee).filter(Boolean)])].sort();const body=`<div class="task-center-summary"><div class="stat"><b>${myOpen}</b><span>My Open Tasks</span></div><div class="stat"><b>${teamOpen}</b><span>Team Open</span></div><div class="stat"><b>${overdue}</b><span>Overdue</span></div><div class="stat"><b>${dueSoon}</b><span>Due Next 7 Days</span></div></div><div class="card pad"><div class="row between wrap" style="margin-bottom:12px"><div><div class="section-title">Across Every Project</div><h2 class="subhead">Task Center</h2><p class="small muted" style="margin:5px 0 0">One place for each team member to see what they own across every active project.</p></div></div><div class="task-center-controls"><div class="field"><label>Assigned To</label><select onchange="setTaskCenterFilter('assignee',this.value)"><option value="__me__" ${f.assignee==='__me__'?'selected':''}>My Tasks — ${esc(me||'Current User')}</option><option value="__all__" ${f.assignee==='__all__'?'selected':''}>All Team</option>${assignees.map(n=>`<option value="${esc(n)}" ${f.assignee===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Project</label><select onchange="setTaskCenterFilter('project',this.value)"><option value="__all__">All Projects</option>${state.projects.map(p=>`<option value="${p.id}" ${f.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select onchange="setTaskCenterFilter('status',this.value)"><option value="open" ${f.status==='open'?'selected':''}>Open</option><option value="not_started" ${f.status==='not_started'?'selected':''}>Not Started</option><option value="working" ${f.status==='working'?'selected':''}>Working On</option><option value="done" ${f.status==='done'?'selected':''}>Done</option><option value="all" ${f.status==='all'?'selected':''}>All</option></select></div><div class="field"><label>Search</label><input value="${esc(f.search||'')}" placeholder="Task, project, client, person..." oninput="taskCenterFilters().search=this.value;renderTaskCenter()"></div></div>${rows.length?`<div class="task-center-list">${rows.map(t=>{const overdue=t.status!=='done'&&t.dueDate&&t.dueDate<today();return `<div class="task-center-row ${overdue?'overdue':''}"><button class="task-circle ${t.status}" title="Advance task status" onclick="cycleTaskCenter('${t.projectId}','${t.id}')"></button><div style="min-width:0;cursor:pointer" onclick="openTaskFromCenter('${t.projectId}','${t.id}')"><b class="small">${esc(t.title)}</b><div class="task-center-project">${esc(t.projectName)}${t.client?` · ${esc(t.client)}`:''}</div></div><div class="small">${esc(t.assignee||'Unassigned')}</div><div class="small">${t.dueDate?fmt(t.dueDate):'<span class="muted">No due date</span>'}${overdue?'<div class="tiny" style="color:var(--rust);font-weight:700">OVERDUE</div>':''}</div><span class="chip ${t.status==='done'?'good':t.status==='working'?'warn':'slate'}">${t.status==='done'?'Done':t.status==='working'?'Working':'Not Started'}</span><button class="btn small" onclick="openTaskFromCenter('${t.projectId}','${t.id}')">Open →</button></div>`}).join('')}</div>`:`<div class="task-center-empty">No tasks match these filters.</div>`}</div>`;document.getElementById('app').innerHTML=shell(body,'Task Center',`<button class="btn small" onclick="setTaskCenterFilter('assignee','__all__')">View All Team</button>`)}
function cycleTaskCenter(projectId,taskId){const p=state.projects.find(x=>x.id===projectId),t=p?.tasks?.find(x=>x.id===taskId);if(!t)return;t.status=t.status==='not_started'?'working':t.status==='working'?'done':'not_started';save(false);renderTaskCenter()}

function createProject(){const name=document.getElementById('np_name').value.trim();if(!name)return toast('Project name is required');const p={id:uid(),name,client:document.getElementById('np_client').value.trim(),owner:document.getElementById('np_owner').value,architectId:document.getElementById('np_architect')?.value||'',designerId:document.getElementById('np_designer')?.value||'',targetStart:document.getElementById('np_target').value,location:document.getElementById('np_location').value.trim(),currentPhase:firstPhaseNumber(),projectSteps:seedProjectSteps(),tasks:[],clarifications:[],plans:[],files:[],meetingNotes:[],clientUpdates:[],inspiration:[],documents:{},documentSlots:[{id:'preliminary',key:'preliminary',label:'Preliminary Proposal'},{id:'formal',key:'formal',label:'Formal Proposal'},{id:'agreement',key:'agreement',label:'Construction Agreement'}],fileTags:['Design Discovery Form','Inspiration Photos','Reading Material','Notes','Other'],planTags:['Architectural','Structural','Electrical','Plumbing','Mechanical','Site Plan','Elevations','Other'],meetingTags:['Client Meeting','Internal','Site Visit','Design Review','Subcontractor'],clarificationRounds:[{id:'round1',name:'1st Round',audience:'Client'}],goVisuallyLink:'',estimateSheetUrl:'',estimateSheetName:'',createdAt:new Date().toISOString(),baselineStart:'',baselineReady:'',forecastReady:''};state.projects.push(p);state.currentProjectId=p.id;state.view='project';state.projectTab='overview';save(false);closeModal();render()}

function overviewTab(p){const cs=currentStep(p);const ph=cs?phaseByNumber(cs.phaseNumber):null;const tpl=cs?allTemplateSteps().find(x=>x.step.id===cs.templateStepId):null;const inPhase=cs?projectStepsFor(p,cs.phaseNumber):[];const stepNo=cs?inPhase.findIndex(s=>s.id===cs.id)+1:0;const overdue=cs?.dueDate&&cs.dueDate<today();const assigned=cs?resolveAssignee(cs):'';const daysActive=cs?.startedDate?daysBetween(cs.startedDate,today()):0;const stuck=cs&&(!assigned||daysActive>10);
 const phases=sortedPhases().map(x=>`<div class="phase-pill ${p.currentPhase===x.number?'active':''}"><span class="phase-num">${x.number}</span>${p.currentPhase===x.number?esc(x.name):''}</div>`).join('')+`<div class="phase-pill ${!p.currentPhase?'active':''}"><span class="phase-num">✓</span></div>`;

al steps</span></div>`:''}</div><div class="task-pane">${taskPane(p)}</div></div>`:`<div class="hero-grid"><div class="hero-main"><div class="section-title">Before Anything Else</div><h2>Set the Baseline Schedule</h2><p class="muted small">Every deadline on this project depends on this being set first — nothing else starts until it is.</p><button class="btn dark" onclick="showBaselineModal()">Set Baseline Schedule</button></div><div class="task-pane">${taskPane(p)}</div></div>`;
 const banner=p.baselineReady?`<div class="baseline-banner"><div class="section-title">Baseline Schedule Active</div><div class="small">Original ready date <b>${fmt(p.baselineReady)}</b> · Current forecast <b>${fmt(forecastReady(p))}</b> · ${varianceLabel(p)}</div></div>`:`<div class="baseline-banner"><div class="section-title">No Baseline Schedule Set</div><div class="small">Nothing to measure against yet — the step below is the one required action right now.</div></div>`;
 return `${banner}<div class="phase-tracker">${phases}</div>${projectTeamPanel(p)}<div class="notice warning">△ Project status is driven by the step-by-step workflow below. Review the project against where it actually stands.</div>${hero}<section class="schedule-section"><div class="schedule-head"><div><div class="section-title">Preconstruction Schedule</div><p class="schedule-explain">This is the real schedule — driven by the same process every project runs through. The <b>Baseline</b> is the original plan and stays frozen. The <b>Forecast</b> moves with real completion dates. Use the full step list below to build ahead, adjust ownership, and manage due dates.</p></div><div class="row wrap"><button class="btn dark small" onclick="scrollToSteps()">📝 Build Schedule Manually</button><button class="btn small" onclick="generateBaselineFromToday()">📌 Auto-Generate Baseline</button><button class="btn small" onclick="window.print()">🖨 Print</button></div></div>${scheduleHealth(p)}${scheduleBars(p)}<div class="section-title" style="margin:18px 0 8px">Full Step List — Every Phase</div>${stepTable(p)}</section>`}
function notesEditor(s){const logs=[...(s.notes||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="section-title">Active-Step Notes</div><div class="row" style="margin-top:7px"><input class="input" id="active_note" placeholder="Log a note without overwriting prior history..."><button class="btn small" onclick="addStepNote('${s.id}')">+ Log Note</button></div><div class="note-log" style="margin-top:8px">${s.legacyNote?`<div class="note-item"><div class="note-meta">Earlier</div>${esc(s.legacyNote)}</div>`:''}${logs.map(n=>`<div class="note-item"><div class="row between"><div class="note-meta">${n.date?new Date(n.date).toLocaleString():'Earlier'} · ${esc(n.author||'Unknown')}</div><button class="btn icon small" onclick="deleteStepNote('${s.id}','${n.id}')">×</button></div>${esc(n.text)}</div>`).join('')}</div>`}
function addStepNote(id){const p=currentProject(),s=p.projectSteps.find(x=>x.id===id),el=document.getElementById('active_note');if(!el.value.trim())return;s.notes=s.notes||[];s.notes.push({id:uid(),text:el.value.trim(),date:new Date().toISOString(),author:state.loggedInName});save(false);renderProject()}
function deleteStepNote(sid,nid){if(!confirm('Delete this note?'))return;const s=currentProject().projectSteps.find(x=>x.id===sid);s.notes=(s.notes||[]).filter(n=>n.id!==nid);save(false);renderProject()}
function overrideAssignee(id,val){const s=currentProject().projectSteps.find(x=>x.id===id);s.assignee=val;s.assigneeOverridden=true;save(false);renderProject()}
function resetAssignee(id){const s=currentProject().projectSteps.find(x=>x.id===id);s.assignee='';s.assigneeOverridden=false;save(false);renderProject()}
function showBaselineModal(isReset=false){const p=currentProject();const suggested=p.baselineStart||today();modal(`<h2>${p.baselineReady?'Reset':'Set'} Baseline Schedule</h2><p class="small muted">What date did preconstruction actually start? ALIGN will build the original baseline schedule forward from this date.</p><div class="field" style="margin-top:14px"><label>Preconstruction Start Date</label><input id="baseline_start_input" type="date" value="${suggested}"></div>${p.baselineReady?`<div class="notice warning" style="margin-top:12px">Resetting the baseline replaces the original planned dates used for variance tracking.</div>`:''}<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyBaselineStart()">${p.baselineReady?'Reset':'Set'} Baseline</button></div>`)}
function applyBaselineStart(){const p=currentProject();const start=document.getElementById('baseline_start_input')?.value;if(!start)return toast('Choose the preconstruction start date.');if(p.baselineReady&&!confirm('Reset the existing baseline using this start date? This replaces the original planned dates.'))return;generateBaseline(p,start);save(false);closeModal();renderProject();toast('Baseline schedule set from '+fmt(start));}
function generateBaselineFromToday(){showBaselineModal(!!currentProject()?.baselineReady)}
function extendCurrentPhase(){const p=currentProject();const n=Number(prompt('How many business days should the remaining schedule be extended from the current phase forward?', '3'));if(!n)return;const idx=p.projectSteps.findIndex(x=>x.status!=='done');for(let i=Math.max(0,idx);i<p.projectSteps.length;i++){const s=p.projectSteps[i];if(s.status!=='done'&&s.dueDate)s.dueDate=iso(shiftBusiness(parseDate(s.dueDate),n));}recalcForecast(p);save(false);renderProject()}
function scheduleHealth(p){const baseDays=p.baselineStart&&p.baselineReady?daysBetween(p.baselineStart,p.baselineReady):null;const foreReady=forecastReady(p);const foreDays=p.baselineStart&&foreReady?daysBetween(p.baselineStart,foreReady):null;const variance=scheduleVarianceDays(p);const forecastStart=computedForecastConstructionStart(p);const statusClass=variance>0?'schedule-behind':variance<0?'schedule-ahead':'schedule-on';const statusText=variance>0?`Behind schedule by ${variance} day${variance===1?'':'s'}`:variance<0?`Ahead of schedule by ${Math.abs(variance)} day${Math.abs(variance)===1?'':'s'}`:'On schedule';const active=currentStep(p);const detail=variance>0&&active?`${active.title} is currently tracking later than its frozen baseline date. Remaining forecast dates and the projected construction start move with this variance.`:variance<0&&active?`${active.title} is tracking ahead of its frozen baseline. Remaining forecast dates and the projected construction start have moved forward.`:'Forecast currently matches the frozen baseline.';return `<div class="schedule-status-banner ${statusClass}"><div><b>${statusText}</b><span>${esc(detail)}</span></div><div class="schedule-status-number">${variance===0?'0':variance>0?`+${variance}`:`${variance}`}<small>days</small></div></div><div class="schedule-health"><div class="health-box"><label>Original Target Start</label><input type="date" value="${p.targetStart||''}" onchange="setProjectField('targetStart',this.value)"></div><div class="health-box ${variance>0?'health-behind':variance<0?'health-ahead':''}"><label>Forecast Construction Start</label><strong>${fmt(forecastStart)}</strong><span class="tiny muted">Moves automatically with schedule variance</span></div><div class="health-box"><label>Baseline Ready</label><strong>${fmt(p.baselineReady)}</strong></div><div class="health-box ${variance>0?'health-behind':variance<0?'health-ahead':''}"><label>Forecast Ready</label><strong>${fmt(foreReady)}</strong></div><div class="health-box"><label>Total Baseline Days</label><strong>${baseDays??'—'}</strong></div><div class="health-box"><label>Total Forecast Days</label><strong>${foreDays??'—'}</strong></div><div class="health-box ${variance>0?'health-behind':variance<0?'health-ahead':''}"><label>Variance</label><strong>${esc(varianceLabel(p))}</strong></div></div><div class="row" style="margin-bottom:10px"><button class="btn small" onclick="extendCurrentPhase()">Extend Current Phase</button><button class="btn small danger" onclick="showBaselineModal(true)">Reset Baseline</button></div>`}
function scheduleBars(p){
 const phases=sortedPhases();
 const dates=[];
 phases.forEach(ph=>projectStepsFor(p,ph.number).forEach(st=>{if(st.baselineDate)dates.push(parseDate(st.baselineDate));if(st.dueDate)dates.push(parseDate(st.dueDate));if(st.completedDate)dates.push(parseDate(st.completedDate))}));
 if(!dates.length)return `<div class="notice">Set a baseline to populate the phase Gantt chart.</div>`;
 let min=new Date(Math.min(...dates.map(d=>d.getTime()))),max=new Date(Math.max(...dates.map(d=>d.getTime())));min.setDate(min.getDate()-3);max.setDate(max.getDate()+3);if(max-min<21*86400000)max.setDate(min.getDate()+28);
 const span=Math.max(1,max-min),pct=d=>Math.max(0,Math.min(100,((parseDate(d)-min)/span)*100));
 const labels=Array.from({length:12},(_,i)=>{const d=new Date(min.getTime()+span*i/11);return `${d.getMonth()+1}/${d.getDate()}`});
 const todayPct=Math.max(0,Math.min(100,((parseDate(today())-min)/span)*100));
 const rows=phases.map(ph=>{const arr=projectStepsFor(p,ph.number),b=arr.filter(x=>x.baselineDate),f=arr.filter(x=>x.dueDate||x.completedDate);if(!arr.length)return'';const b0=b[0]?.baselineDate,b1=b[b.length-1]?.baselineDate;const f0=(f[0]?.completedDate||f[0]?.dueDate||b0),f1=(f[f.length-1]?.completedDate||f[f.length-1]?.dueDate||b1);const done=arr.length?arr.filter(x=>x.status==='done').length/arr.length:0;const leftB=b0?pct(b0):0,widthB=b1?Math.max(1,pct(b1)-leftB):1,leftF=f0?pct(f0):leftB,widthF=f1?Math.max(1,pct(f1)-leftF):widthB;return `<div class="gantt-row"><button type="button" class="gantt-label" onclick="showPhaseSteps(${ph.number})" title="View steps in this phase">Phase ${ph.number} · ${esc(ph.name)}</button><div class="gantt-track"><div class="gantt-today" style="left:${todayPct}%"></div><div class="gantt-baseline" style="left:${leftB}%;width:${widthB}%"></div><div class="gantt-forecast" style="left:${leftF}%;width:${widthF}%"></div><div class="gantt-complete" style="left:${leftF}%;width:${widthF*done}%"></div></div></div>`}).join('');
 return `<div class="gantt-legend"><span><i class="legend-swatch legend-baseline"></i>Baseline</span><span><i class="legend-swatch legend-forecast"></i>Forecast</span><span><i class="legend-swatch legend-complete"></i>Completed progress</span><span style="color:var(--rust)">│ Today</span></div><div class="gantt"><div class="gantt-inner"><div class="gantt-axis"><div>Phase</div>${labels.map(x=>`<div>${x}</div>`).join('')}</div>${rows}</div></div>`;
}
function showPhaseSteps(phaseNumber){const p=currentProject(),ph=phaseByNumber(phaseNumber),steps=projectStepsFor(p,phaseNumber);if(!ph)return;modal(`<div class="row between"><div><div class="section-title">Phase ${ph.number}</div><h2 style="margin:4px 0 2px">${esc(ph.name)}</h2><div class="small muted">${steps.length} step${steps.length===1?'':'s'} in this phase</div></div></div><div style="margin-top:14px">${steps.map((st,i)=>{const ass=resolveAssignee(st);const status=st.status==='done'?'Complete':st.status==='working'?'In Progress':'Not Started';return `<div class="note-item" style="margin-bottom:8px"><div class="row between" style="gap:12px"><div><b>${i+1}. ${esc(st.title)}</b><div class="tiny muted" style="margin-top:3px">${esc(st.role||'')} · ${esc(ass||'Unassigned')}</div></div><span class="chip ${st.status==='done'?'good':st.status==='working'?'warn':''}">${status}</span></div><div class="tiny muted" style="margin-top:7px">Baseline ${fmt(st.baselineDate)} · Forecast ${fmt(st.dueDate)}</div></div>`}).join('')}</div><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Done</button></div>`)}
function stepTable(p){return `<div class="step-table"><div class="step-row header"><div></div><div>Step</div><div>Assigned To</div><div>Due Date</div><div>Baseline</div><div>Actions</div></div>${p.projectSteps.map((s,i)=>{const cur=currentStep(p)?.id===s.id;const ass=resolveAssignee(s);return `<div class="step-row ${cur?'current':''} ${s.status==='done'?'done':''}"><button class="status-dot ${s.status}" title="Cycle status" onclick="cycleStep('${s.id}')"></button><div><b>${esc(s.title)}</b><div class="tiny muted">Phase ${s.phaseNumber} · ${esc(s.role)}</div></div><select class="input" onchange="overrideAssignee('${s.id}',this.value)"><option value="">Unassigned</option>${people().map(n=>`<option ${ass===n?'selected':''}>${esc(n)}</option>`).join('')}</select><input class="input" type="date" value="${s.dueDate||''}" onchange="setStepDue('${s.id}',this.value)"><div class="small">${fmt(s.baselineDate)}</div><div class="row wrap"><button class="btn small" onclick="resetAssignee('${s.id}')">Use Default</button>${cur?`<button class="btn dark small" onclick="advanceCurrentStep()">Complete & Next →</button>`:s.status==='done'?`<button class="btn small" onclick="cycleStep('${s.id}')">↩ Return Here</button>`:`<span class="tiny muted">Locked until prior step is complete</span>`}</div></div>`}).join('')}</div>`}
function startCurrentStep(){const p=currentProject(),s=currentStep(p);if(!s)return;s.status='working';s.startedDate=s.startedDate||today();save(false);renderProject()}
function advanceCurrentStep(){const p=currentProject(),s=currentStep(p);if(!s)return;const i=p.projectSteps.findIndex(x=>x.id===s.id);const finished=today();const scheduled=s.dueDate||s.baselineDate;const shift=scheduled?businessDaysBetween(scheduled,finished):0;s.status='done';s.completedDate=finished;s.startedDate=s.startedDate||finished;if(shift!==0){for(let j=i+1;j<p.projectSteps.length;j++){const future=p.projectSteps[j];if(future.status!=='done'&&future.dueDate)future.dueDate=iso(shiftBusiness(parseDate(future.dueDate),shift));}}const next=p.projectSteps[i+1];if(next){next.status='working';next.startedDate=next.startedDate||finished;}recomputeProjectPhase(p);recalcForecast(p);save(false);renderProject();const movement=shift<0?` Schedule pulled forward ${Math.abs(shift)} business day${Math.abs(shift)===1?'':'s'}.`:shift>0?` Schedule moved back ${shift} business day${shift===1?'':'s'}.`:'';toast(next?`Advanced to: ${next.title}.${movement}`:`Preconstruction complete.${movement}`)}
function goBackStep(){const p=currentProject();let s=currentStep(p),i=s?p.projectSteps.findIndex(x=>x.id===s.id):p.projectSteps.length;if(i<=0)return toast('This is the first step');const prev=p.projectSteps[i-1];if(s){s.status='not_started';s.startedDate='';s.completedDate='';}prev.status='working';prev.completedDate='';prev.startedDate=prev.startedDate||today();for(let j=i+1;j<p.projectSteps.length;j++){if(p.projectSteps[j].status!=='done')continue;p.projectSteps[j].status='not_started';p.projectSteps[j].completedDate='';p.projectSteps[j].startedDate='';}recomputeProjectPhase(p);recalcForecast(p);save(false);renderProject();toast(`Moved back to: ${prev.title}`)}
function cycleStep(id){const p=currentProject(),s=p.projectSteps.find(x=>x.id===id),cur=currentStep(p);if(!s)return;if(cur&&s.id===cur.id){if(s.status==='not_started')startCurrentStep();else advanceCurrentStep();return}const idx=p.projectSteps.findIndex(x=>x.id===id),curIdx=cur?p.projectSteps.findIndex(x=>x.id===cur.id):p.projectSteps.length;if(idx<curIdx){if(!confirm(`Move the workflow back to "${s.title}"? Steps after it will be reopened as needed.`))return;for(let j=idx;j<p.projectSteps.length;j++){p.projectSteps[j].status=j===idx?'working':'not_started';p.projectSteps[j].completedDate='';if(j!==idx)p.projectSteps[j].startedDate='';}s.startedDate=s.startedDate||today();recomputeProjectPhase(p);recalcForecast(p);save(false);renderProject();return}toast('Finish the current step before moving ahead.')}
function setStepDue(id,val){const p=currentProject(),s=p.projectSteps.find(x=>x.id===id);s.dueDate=val;recalcForecast(p);save(false);renderProject()}
function setProjectField(k,v){currentProject()[k]=v;save(false)}
function scrollToSteps(){document.querySelector('.step-table')?.scrollIntoView({behavior:'smooth'})}

function taskPane(p){const filters=['open','not_started','working','done','all'];p._taskFilter=p._taskFilter||'open';const counts={open:p.tasks.filter(t=>t.status!=='done').length,not_started:p.tasks.filter(t=>t.status==='not_started').length,working:p.tasks.filter(t=>t.status==='working').length,done:p.tasks.filter(t=>t.status==='done').length,all:p.tasks.length};const shown=p._taskFilter==='all'?p.tasks:p._taskFilter==='open'?p.tasks.filter(t=>t.status!=='done'):p.tasks.filter(t=>t.status===p._taskFilter);return `<div class="row between"><div class="section-title">Tasks</div><button class="btn small" onclick="showTaskModal()">+ Add Task</button></div><div class="row wrap" style="margin:9px 0">${filters.map(f=>`<button class="chip ${p._taskFilter===f?'good':''}" style="border:0;cursor:pointer" onclick="setTaskFilter('${f}')">${f.replace('_',' ')} (${counts[f]})</button>`).join('')}</div>${shown.length?shown.map(t=>`<div class="task-compact"><button class="task-circle ${t.status}" onclick="cycleTask('${t.id}')"></button><div style="flex:1" onclick="showTaskModal('${t.id}')"><b class="small">${esc(t.title)}</b><div class="tiny muted">${t.dueDate?fmt(t.dueDate):''}${t.assignee?` · ${esc(t.assignee)}`:''}</div></div></div>`).join(''):`<div class="empty">${p._taskFilter==='open'?'No open tasks.':'No tasks in this view.'}</div>`}`}
function setTaskFilter(f){currentProject()._taskFilter=f;renderProject()}
function showTaskModal(id=''){const p=currentProject(),t=id?p.tasks.find(x=>x.id===id):{title:'',assignee:'',dueDate:'',dependsOn:'',attachments:[],status:'not_started'};modal(`<h2>${id?'Task Detail':'Add Task'}</h2><div class="field"><label>Title</label><input id="tm_title" value="${esc(t.title)}"></div><div class="split" style="margin-top:10px"><div class="field"><label>Assignee</label><select id="tm_assignee"><option value="">Unassigned</option>${people().map(n=>`<option ${t.assignee===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Due Date</label><input id="tm_due" type="date" value="${t.dueDate||''}"></div><div class="field"><label>Depends On</label><select id="tm_dep"><option value="">None</option>${p.tasks.filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${t.dependsOn===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="tm_status"><option value="not_started" ${t.status==='not_started'?'selected':''}>Not Started</option><option value="working" ${t.status==='working'?'selected':''}>Working On</option><option value="done" ${t.status==='done'?'selected':''}>Done</option></select></div></div>${id?`<div class="field" style="margin-top:10px"><label>Attachments</label><input type="file" multiple onchange="addTaskFiles('${id}',this.files)"><div>${(t.attachments||[]).map(f=>`<div class="file-row"><span>${esc(f.name)}</span><div><button class="btn small" onclick="previewFileByObject('task','${id}','${f.id}')">View</button><button class="btn small danger" onclick="removeTaskFile('${id}','${f.id}')">Remove</button></div></div>`).join('')}</div></div>`:''}<div class="modal-actions">${id?`<button class="btn danger" onclick="deleteTask('${id}')">Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTask('${id}')">Save</button></div>`)}
function saveTask(id){const p=currentProject();let t=id?p.tasks.find(x=>x.id===id):{id:uid(),attachments:[]};t.title=document.getElementById('tm_title').value.trim();if(!t.title)return toast('Task title required');t.assignee=document.getElementById('tm_assignee').value;t.dueDate=document.getElementById('tm_due').value;t.dependsOn=document.getElementById('tm_dep').value;t.status=document.getElementById('tm_status').value;if(!id)p.tasks.push(t);save(false);closeModal();renderProject()}

function clarificationsTab(p){

 const rid=p._activeClarRound||p.clarificationRounds[0].id;const round=p.clarificationRounds.find(r=>r.id===rid)||p.clarificationRounds[0];const rows=p.clarifications.filter(c=>(c.roundId||'round1')===round.id);const open=rows.filter(c=>!String(c.response||'').trim()).length;

function manageProjectTags(key){const p=currentProject(),tags=p[key]||[];modal(`<h2>Manage Tags</h2><div id="tag_manage_list">${tags.map((t,i)=>`<div class="row" style="margin:7px 0"><input class="input" value="${esc(t)}" onchange="renameProjectTag('${key}',${i},this.value)"><button class="btn small danger" onclick="deleteProjectTag('${key}',${i})">×</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><input class="input" id="new_tag_name" placeholder="New tag"><button class="btn" onclick="addProjectTag('${key}')">+ Add</button></div><div class="modal-actions"><button class="btn primary" onclick="closeModal();renderProject()">Done</button></div>`)}

ing notes — title, text, or tag..." value="${esc(p._meetingSearch||'')}" oninput="setMeetingSearch(this.value)">${p._meetingSearch?`<button class="tagbtn" onclick="setMeetingSearch('')">Clear</button>`:''}</div>${notes.length?notes.map(n=>`<div class="flat-card pad" style="margin-bottom:10px"><div class="row between"><div><b>${esc(n.title||'Meeting Note')}</b><div class="tiny muted">${n.created?new Date(n.created).toLocaleString():fmt(n.date)} · ${esc(n.author||'')}</div></div><button class="btn icon small danger" onclick="deleteMeeting('${n.id}')">×</button></div><div class="tagbar">${(n.tags||[]).map(t=>`<span class="tagbtn active">${esc(t)}</span>`).join('')}</div><div class="small" style="line-height:1.55">${n.html||esc(n.notes||'')}</div></div>`).join(''):`<div class="empty">No meeting notes logged yet — write one above and click “Log Meeting Note.”</div>`}`
}

function clientPhaseRanges(p){
 const phases=sortedPhases();
 return phases.map(ph=>{const arr=projectStepsFor(p,ph.number);const dates=arr.flatMap(st=>[st.baselineDate,st.dueDate,st.completedDate].filter(Boolean));const start=arr.find(st=>st.baselineDate||st.dueDate||st.completedDate);const end=[...arr].reverse().find(st=>st.completedDate||st.dueDate||st.baselineDate);const startDate=start?(start.baselineDate||start.dueDate||start.completedDate):'';const endDate=end?(end.completedDate||end.dueDate||end.baselineDate):'';const working=arr.reduce((n,st)=>n+(Number((allTemplateSteps().find(x=>x.step.id===st.templateStepId)?.step.duration)||0)),0);const done=arr.length?arr.filter(st=>st.status==='done').length/arr.length:0;return {ph,arr,startDate,endDate,working,done}})
}
function clientScheduleVisual(p){
 const rows=clientPhaseRanges(p),valid=rows.flatMap(r=>[r.startDate,r.endDate].filter(Boolean)).map(parseDate);
 if(!valid.length)return `<div class="notice">The client schedule will appear after the baseline schedule is set.</div>`;
 let min=new Date(Math.min(...valid.map(d=>d.getTime()))),max=new Date(Math.max(...valid.map(d=>d.getTime())));min.setDate(min.getDate()-2);max.setDate(max.getDate()+2);if(max-min<35*86400000)max.setDate(min.getDate()+35);const span=Math.max(1,max-min);const pct=d=>Math.max(0,Math.min(100,((parseDate(d)-min)/span)*100));const axis=Array.from({length:7},(_,i)=>{const d=new Date(min.getTime()+span*i/6);return {p:(i/6)*100,l:d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}});const tp=pct(today());
 return `<div class="client-schedule"><div class="client-schedule-inner"><div class="client-schedule-axis"><div class="client-axis-label">Full Schedule</div><div class="client-timeline-axis">${axis.map(a=>`<span class="axis-date" style="left:${a.p}%">${a.l}</span>`).join('')}<div class="client-today-line" style="left:${tp}%"></div></div><div></div></div>${rows.map(r=>{const left=r.startDate?pct(r.startDate):0,w=r.endDate?Math.max(1,pct(r.endDate)-left):1;const cls=r.done>=1?'done':p.currentPhase===r.ph.number?'current':'';return `<div class="client-sched-row"><div class="client-sched-label">Phase ${r.ph.number} · ${esc(r.ph.name)}<small>${r.working||'—'} working days scheduled</small></div><div class="client-sched-track"><div class="client-today-line" style="left:${tp}%"></div>${r.startDate?`<div class="client-sched-bar ${cls}" style="left:${left}%;width:${w}%"></div>`:''}</div><div class="client-date-range">${r.startDate?`${fmt(r.startDate)} → ${fmt(r.endDate)}`:'Dates not set'}</div></div>`}).join('')}</div></div><div class="gantt-legend"><span><i class="legend-swatch legend-baseline"></i>Target</span><span><i class="legend-swatch legend-forecast"></i>Current phase</span><span><i class="legend-swatch legend-complete"></i>Complete</span><span style="color:var(--rust)">│ Today</span></div>`
}
function clientPhaseCards(p){return `<div class="client-phase-grid">${sortedPhases().map(x=>`<div class="client-phase ${p.currentPhase===x.number?'current':''}" style="--pc:${x.color||phaseColor(x.number)}">${p.currentPhase===x.number?'<span class="current-ribbon">Current Phase</span>':''}<div class="row"><span class="phase-num" style="background:${x.color||phaseColor(x.number)};color:white">${x.number}</span><b>${esc(x.name)}</b></div><p class="small muted" style="margin:10px 0 0;line-height:1.55">${esc(x.description||'')}</p></div>`).join('')}</div>`}
function emailEmbedHtml(p){
 const ph=phaseByNumber(p.currentPhase),latest=[...p.clientUpdates].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0],ranges=clientPhaseRanges(p);const currentLabel=ph?`Phase ${ph.number} · ${ph.name}`:'Ready for Production';
 const phaseCards=sortedPhases().map(x=>`<td style="width:33.33%;padding:5px;vertical-align:top"><div style="border:1px solid #e2dfd7;border-top:3px solid ${x.color||phaseColor(x.number)};border-radius:8px;padding:10px;background:${p.currentPhase===x.number?'#f5f0e5':'#ffffff'};min-height:105px"><div style="font-size:11px;font-weight:700;color:#2f2e2a">${x.number}. ${esc(x.name)}</div><div style="font-size:10px;line-height:1.45;color:#77746d;margin-top:6px">${esc(x.description||'')}</div></div></td>`).join('');
 const sched=ranges.map(r=>`<tr><td style="padding:7px 4px;font-size:10px;font-weight:700;color:#33322e">Phase ${r.ph.number} · ${esc(r.ph.name)}</td><td style="padding:7px 4px;font-size:10px;color:#77746d;text-align:right">${r.startDate?`${fmt(r.startDate)} → ${fmt(r.endDate)}`:'Dates not set'}</td></tr>`).join('');
 return `<div style="font-family:Arial,Helvetica,sans-serif;color:#2c2b27;max-width:760px;background:#ffffff;border:1px solid #dedbd3;border-radius:12px;padding:20px"><div style="text-align:center"><div style="font-size:22px;font-weight:700">${esc(p.name)}</div><div style="font-size:12px;color:#77746d;margin-top:3px">${esc(p.client)}${p.location?' · '+esc(p.location):''}</div><div style="display:inline-block;margin-top:10px;padding:5px 10px;border-radius:999px;background:#eeece6;font-size:11px;font-weight:700">Currently in ${esc(currentLabel)}</div></div><div style="margin-top:20px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#88857e;font-weight:700">Schedule</div><table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin-top:5px">${sched}</table>${latest?`<div style="margin-top:16px;padding:12px;border-radius:8px;background:#faf8f3;border:1px solid #e8e2d5"><div style="font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:#88857e;font-weight:700">Latest Update · ${fmt(latest.date)}</div><div style="font-size:12px;line-height:1.5;margin-top:6px">${esc(latest.text)}</div></div>`:''}<div style="margin-top:18px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#88857e;font-weight:700">What Each Phase Means</div><table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin-top:4px"><tr>${phaseCards.slice(0,phaseCards.length/2).join('')}</tr><tr>${phaseCards.slice(phaseCards.length/2).join('')}</tr></table><div style="font-size:9px;color:#99958e;text-align:center;margin-top:14px">Mitchell Construction & Design · ALIGN Preconstruction Update</div></div>`
}
function clientTab(p){
 const ph=phaseByNumber(p.currentPhase),tab=p._clientViewTab||'schedule',latest=[...p.clientUpdates].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
 const body=tab==='updates'?`<div class="row between" style="margin-bottom:10px"><div class="client-section-label" style="margin:0">Client Updates</div><button class="btn primary small" onclick="showClientUpdateModal()">+ Add Update</button></div>${p.clientUpdates.length?p.clientUpdates.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(u=>`<div class="client-update-card"><div class="note-meta">${fmt(u.date)} · ${esc(u.author)}</div><div style="line-height:1.55">${esc(u.text)}</div></div>`).join(''):`<div class="client-update-empty">No client updates posted yet.</div>`}`:`<div class="client-section-label">Full Schedule</div>${clientScheduleVisual(p)}<div class="client-section-label">What Each Phase Means</div>${clientPhaseCards(p)}`;

async function copyEmailEmbed(){const p=currentProject(),html=emailEmbedHtml(p),ph=phaseByNumber(p.currentPhase),latest=[...p.clientUpdates].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];const text=`${p.name}\n${p.client}\n\nCurrently in ${ph?`Phase ${ph.number} · ${ph.name}`:'Ready for Production'}\n\n${latest?latest.text:''}\n\nPreconstruction schedule and phase overview included in the formatted email block.`;try{if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);toast('Formatted client email copied — paste directly into your email.')}else{await navigator.clipboard.writeText(text);toast('Email summary copied as text')}}catch(e){const el=document.createElement('div');el.contentEditable='true';el.style.position='fixed';el.style.left='-9999px';el.innerHTML=html;document.body.appendChild(el);const range=document.createRange();range.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);document.execCommand('copy');sel.removeAllRanges();el.remove();toast('Formatted client email copied')}}

function addLocation(){const v=document.getElementById('new_loc').value.trim();if(v&&!state.company.locations.includes(v)){state.company.locations.push(v);save(false);renderSettings()}}
function removeLocation(i){if(confirm('Remove this location?')){state.company.locations.splice(i,1);save(false);renderSettings()}}
function settingsAutomations(){const tomorrow=iso(new Date(Date.now()+86400000));const meetings=state.projects.flatMap(p=>p.meetingNotes.filter(m=>m.date===tomorrow).map(m=>({project:p.name,...m})));return section('automations','Automations',`<div class="notice"><b>Meetings Needing a Reminder Tomorrow</b>${meetings.length?meetings.map(m=>`<div class="file-row"><span>${esc(m.project)} · ${esc(m.type)}</span><button class="btn small">Send Reminder</button></div>`).join(''):`<div class="small muted" style="margin-top:5px">No meetings due tomorrow.</div>`}</div><table class="table" style="margin-top:10px"><thead><tr><th>Name</th><th>Trigger</th><th>Action</th><th>Status</th></tr></thead><tbody>${state.company.automations.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.trigger)}</td><td>${esc(a.action)}</td><td>${a.enabled?'On':'Off'}</td></tr>`).join('')}</tbody></table>`,`<button class="btn small" onclick="showAutomationModal()">+ New Automation</button>`)}
function showAutomationModal(){modal(`<h2>New Automation</h2><div class="field"><label>Name</label><input id="a_name"></div><div class="split" style="margin-top:10px"><div class="field"><label>Trigger</label><input id="a_trigger" placeholder="e.g. Step completed"></div><div class="field"><label>Action</label><input id="a_action" placeholder="e.g. Create task"></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAutomation()">Save</button></div>`)}
function saveAutomation(){state.company.automations.push({id:uid(),name:document.getElementById('a_name').value,trigger:document.getElementById('a_trigger').value,action:document.getElementById('a_action').value,enabled:true});save(false);closeModal();renderSettings()}
function settingsTemplates(){const slots=[['preliminary','Preliminary Proposal'],['formal','Formal Proposal'],['agreement','Construction Agreement']];return section('templates','Document Templates',`<div class="three">${slots.map(([k,l])=>`<div class="doc-slot"><b>${l}</b><p class="small muted">${state.company.documentTemplates[k]?.name||'No template uploaded'}</p><label class="btn small">${state.company.documentTemplates[k]?'Replace':'Upload'}<input type="file" hidden onchange="uploadTemplate('${k}',this.files[0])"></label>${state.company.documentTemplates[k]?` <button class="btn small" onclick="previewTemplate('${k}')">View</button>`:''}</div>`).join('')}</div>`)}
async function uploadTemplate(k,f){if(!f)return;state.company.documentTemplates[k]={id:uid(),name:f.name,mime:f.type||'application/octet-stream',data:await readFile(f),uploadedAt:new Date().toISOString()};save(false);renderSettings()}
function settingsEstimateTemplate(){const t=state.company.estimateTemplate||{};return section('estimatetemplate','Estimate Template',`<p class="small muted">This is the master Google Sheet used to start every project estimate. ALIGN should never edit the master directly; each project should use its own copy.</p><div class="split" style="margin-top:12px"><div class="field"><label>Template Name</label><input id="estimate_tpl_name" value="${esc(t.name||'')}" placeholder="MCD Estimating Template"></div><div class="field"><label>Google Sheet Template URL</label><input id="estimate_tpl_url" value="${esc(t.url||'')}" placeholder="https://docs.google.com/spreadsheets/d/..."></div></div><div class="row wrap" style="margin-top:12px"><button class="btn primary" onclick="saveEstimateTemplate()">Save Template</button>${t.url?`<a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener">Open Template ↗</a><a class="btn" href="${sheetCopyUrl(t.url)}" target="_blank" rel="noopener">Test Create Copy ↗</a>`:''}</div>`)}
function saveEstimateTemplate(){const url=document.getElementById('estimate_tpl_url').value.trim();if(url&&!sheetIdFromUrl(url))return alert('Paste a valid Google Sheets URL.');state.company.estimateTemplate={name:document.getElementById('estimate_tpl_name').value.trim()||'Estimating Template',url};save(false);renderSettings();toast('Estimate template saved')}
function settingsBranding(){const b=state.company.branding||{};return section('branding','Branding',`<div class="split"><div><div class="field"><label>Company Logo</label><div class="small muted" style="margin-bottom:7px">Upload the full Mitchell Construction & Design logo. It will appear full-width in the sidebar with ALIGN centered directly underneath.</div><input type="file" accept="image/*" onchange="uploadLogo(this.files[0])"></div>${b.logo?`<img class="logo-preview" style="width:${b.logoSize||120}px;margin-top:10px" src="${b.logo}">`:''}<div class="field" style="margin-top:10px"><label>Logo Size <span>${b.logoSize||120}px</span></label><input type="range" min="60" max="220" value="${b.logoSize||120}" oninput="setLogoSize(this.value)"></div></div><div>${[['ink','Primary Ink','--ink'],['accent','Accent / Taupe','--accent'],['jade','Success / Jade','--jade'],['rust','Alert / Rust','--rust'],['gold','Highlight / Gold','--gold']].map(([k,l,css])=>`<div class="color-row"><b class="small">${l}</b><input type="color" value="${b.colors?.[k]||rgbToHex(getComputedStyle(document.documentElement).getPropertyValue(css).trim())}" onchange="setThemeColor('${k}','${css}',this.value)"><code>${css}</code></div>`).join('')}<button class="btn small" onclick="resetTheme()">Reset to Defaults</button></div></div>`)}
function rgbToHex(c){return /^#/.test(c)?c:'#555555'}
async function uploadLogo(f){if(!f)return;state.company.branding.logo=await readFile(f);save(false);renderSettings()}
function setLogoSize(v){state.company.branding.logoSize=Number(v);save(false);renderSettings()}
function setThemeColor(k,css,v){state.company.branding.colors=state.company.branding.colors||{};state.company.branding.colors[k]=v;document.documentElement.style.setProperty(css,v);save(false)}
function resetTheme(){state.company.branding.colors={};save(false);location.reload()}
function settingsStorage(){return section('storage','Data & Storage',`<div class="row between"><div><b>${state.lastSaved?'Saved '+new Date(state.lastSaved).toLocaleString():'Saved locally'}</b><div class="small muted">This prototype stores locally in this browser. Production should use per-record relational storage.</div><div class="tiny muted" style="margin-top:5px">${BUILD}</div></div><button class="btn danger" onclick="resetAllData()">Clear Saved Data & Reset to Demo</button></div>`)}
function resetAllData(){if(!confirm('This will wipe every project and setting in this browser. Continue?'))return;state=defaultState();save(false);renderSettings()}
function settingsBackups(){return section('backups','Emergency Backups',`<div class="row between"><div class="small muted">Independent rotating snapshots. Prototype stores up to 24 local snapshots.</div><button class="btn small" onclick="makeBackup()">Create Snapshot</button></div><div style="margin-top:8px">${(state.company.backups||[]).slice().reverse().map(b=>`<div class="file-row"><span>${new Date(b.time).toLocaleString()}</span><button class="btn small" onclick="restoreBackup('${b.id}')">Restore this backup</button></div>`).join('')||'<div class="empty">No snapshots yet.</div>'}</div>`)}
function makeBackup(){const clone=JSON.parse(JSON.stringify(state));clone.company.backups=[];state.company.backups=state.company.backups||[];state.company.backups.push({id:uid(),time:new Date().toISOString(),data:clone});if(state.company.backups.length>24)state.company.backups.shift();state.company.backupCounter=(state.company.backupCounter||0)+1;save(false);renderSettings()}
function restoreBackup(id){if(!confirm('Restore this snapshot and replace the current live state?'))return;const b=state.company.backups.find(x=>x.id===id);if(!b)return;const backups=state.company.backups;state=JSON.parse(JSON.stringify(b.data));state.company.backups=backups;save(false);renderSettings()}

function roleDropdownOptions(selected){
  const defaults=['Architect','Designer','Client','Estimator','Subcontractor','Entire Team','S/C','P/C Coordinator','Estimator & S/C','S/C & Estimator'];
  const fromSettings=Object.keys(state.company.roleAssignees||{});
  const fromProcess=(state.company.phases||[]).flatMap(ph=>(ph.steps||[]).map(st=>st.role)).filter(Boolean);
  const roles=[...new Set([...defaults,...fromSettings,...fromProcess])].sort((a,b)=>a.localeCompare(b));
  if(selected && !roles.includes(selected)) roles.unshift(selected);
  return roles.map(r=>`<option value="${esc(r)}" ${r===selected?'selected':''}>${esc(r)}</option>`).join('');
}
function settingsProcess(){return section('process','Preconstruction Process (Manage Process)',`${sortedPhases().map((ph,pi)=>`<div class="phase-settings"><div class="phase-settings-head"><input class="input" type="number" min="1" value="${ph.number}" onchange="renumberPhase('${ph.id}',this.value)"><input class="input" value="${esc(ph.name)}" onchange="renamePhase('${ph.id}',this.value)"><span class="chip">${ph.steps.reduce((a,s)=>a+(Number(s.duration)||0),0)} business days</span><button class="btn small danger" onclick="deletePhase('${ph.id}')">Delete Phase</button></div>${ph.steps.map((s,si)=>`<div class="template-step"><div class="row"><button class="btn icon small" onclick="moveStep('${ph.id}','${s.id}',-1)">↑</button><button class="btn icon small" onclick="moveStep('${ph.id}','${s.id}',1)">↓</button></div><input class="input" value="${esc(s.title)}" onchange="editTemplateStep('${ph.id}','${s.id}','title',this.value)"><select class="input" onchange="editTemplateStep('${ph.id}','${s.id}','role',this.value)">${roleDropdownOptions(s.role)}</select><input class="input" type="number" min="1" value="${s.duration}" onchange="editTemplateStep('${ph.id}','${s.id}','duration',this.value)"><div class="revision-control"><label class="small"><input type="checkbox" ${s.canRevise?'checked':''} onchange="editTemplateStep('${ph.id}','${s.id}','canRevise',this.checked)"> Can Revise</label>${s.canRevise?`<select class="input small" onchange="setRevisionTarget('${ph.id}','${s.id}',this.value)"><option value="">— pick the earlier step it goes back to —</option>${ph.steps.slice(0,si).map(t=>`<option value="${t.id}" ${s.revisesStepId===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select>`:''}</div><div class="meeting-setting"><label class="small"><input type="checkbox" ${s.needsMeeting?'checked':''} onchange="toggleMeeting('${ph.id}','${s.id}',this.checked)"> Needs Meeting</label>${s.needsMeeting?`<button class="meeting-attendees-summary" onclick="showMeetingPicker('${ph.id}','${s.id}')">${(s.meetingWith||[]).length?esc((s.meetingWith||[]).join(', ')):'Set attendees'}</button>`:''}</div><button class="btn icon danger small" onclick="deleteTemplateStep('${ph.id}','${s.id}')">×</button></div>`).join('')}<div style="padding:10px"><button class="btn small" onclick="addTemplateStep('${ph.id}')">+ Add Step to Phase ${ph.number}</button></div></div>`).join('')}<button class="btn primary" onclick="addPhase()">+ Add Phase</button>`)}
function renamePhase(id,v){state.company.phases.find(x=>x.id===id).name=v;save(false);renderSettings()}
function renumberPhase(id,v){v=Number(v);if(!Number.isInteger(v)||v<1)return renderSettings();if(state.company.phases.some(x=>x.id!==id&&x.number===v)){alert('That phase number is already in use. Renumber the conflicting phase first.');return renderSettings()}const ph=state.company.phases.find(x=>x.id===id),old=ph.number;if(!confirm(`Renumber Phase ${old} to Phase ${v}? This updates every project using that phase number.`))return renderSettings();ph.number=v;state.projects.forEach(p=>{if(p.currentPhase===old)p.currentPhase=v;p.projectSteps.forEach(s=>{if(s.phaseNumber===old)s.phaseNumber=v})});state.company.phases.sort((a,b)=>a.number-b.number);save(false);renderSettings()}
function deletePhase(id){if(state.company.phases.length<=1)return alert('The last remaining phase cannot be deleted.');const ph=state.company.phases.find(x=>x.id===id);if(!confirm(`Delete Phase ${ph.number} · ${ph.name}? Projects currently on it may need manual attention.`))return;state.company.phases=state.company.phases.filter(x=>x.id!==id);state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function addPhase(){const name=prompt('New phase name:');if(!name)return;const num=Math.max(...state.company.phases.map(p=>p.number))+1;state.company.phases.push({id:uid(),number:num,name,color:phaseColor(num),description:'',steps:[]});save(false);renderSettings()}
function addTemplateStep(pid){const ph=state.company.phases.find(x=>x.id===pid);ph.steps.push({id:uid(),title:'New Step',role:'Entire Team',duration:1,canRevise:false,revisesStepId:null,needsMeeting:false,meetingWith:[]});state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function deleteTemplateStep(pid,sid){if(!confirm('Delete this step from the company process?'))return;const ph=state.company.phases.find(x=>x.id===pid);ph.steps=ph.steps.filter(s=>s.id!==sid);state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function moveStep(pid,sid,dir){const ph=state.company.phases.find(x=>x.id===pid),i=ph.steps.findIndex(x=>x.id===sid),j=i+dir;if(j<0||j>=ph.steps.length)return;[ph.steps[i],ph.steps[j]]=[ph.steps[j],ph.steps[i]];state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function editTemplateStep(pid,sid,key,val){const ph=state.company.phases.find(x=>x.id===pid),s=ph.steps.find(x=>x.id===sid);s[key]=key==='duration'?Number(val):val;if(key==='canRevise'&&!val)s.revisesStepId=null;state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function setRevisionTarget(pid,sid,targetId){const ph=state.company.phases.find(x=>x.id===pid),s=ph.steps.find(x=>x.id===sid);if(!s)return;const fromIndex=ph.steps.findIndex(x=>x.id===sid),targetIndex=ph.steps.findIndex(x=>x.id===targetId);if(targetId&&targetIndex>=fromIndex){alert('A revision can only return to an earlier step in the same phase.');return renderSettings()}s.revisesStepId=targetId||null;save(false);renderSettings()}
function sendCurrentStepForRevision(){const p=currentProject(),cs=currentStep(p);if(!cs)return;const tpl=allTemplateSteps().find(x=>x.step.id===cs.templateStepId);if(!tpl?.step.canRevise)return toast('This step is not marked as revisable.');const targetTplId=tpl.step.revisesStepId;if(!targetTplId)return alert('Choose a revision return step in Company Settings first.');const target=p.projectSteps.find(x=>x.templateStepId===targetTplId&&Number(x.phaseNumber)===Number(cs.phaseNumber));if(!target)return alert('The revision target could not be found in this project.');if(!confirm(`Send this work back for revision to “${target.title}”?`))return;const start=p.projectSteps.findIndex(x=>x.id===target.id),end=p.projectSteps.findIndex(x=>x.id===cs.id);for(let i=start;i<=end;i++){const s=p.projectSteps[i];s.status=i===start?'working':'not_started';s.completedDate='';if(i!==start)s.startedDate='';}target.startedDate=target.startedDate||today();recomputeProjectPhase(p);recalcForecast(p);save(false);renderProject();toast(`Revision returned to: ${target.title}`)}
function toggleMeeting(pid,sid,checked){const s=state.company.phases.find(x=>x.id===pid).steps.find(x=>x.id===sid);s.needsMeeting=checked;save(false);if(checked)showMeetingPicker(pid,sid);else renderSettings()}
function showMeetingPicker(pid,sid){const s=state.company.phases.find(x=>x.id===pid).steps.find(x=>x.id===sid);modal(`<h2>Who's in this meeting?</h2><p class="small muted">${esc(s.title)}</p><div class="stack">${state.company.meetingOptions.map(o=>`<label><input type="checkbox" ${s.meetingWith.includes(o)?'checked':''} onchange="setMeetingAttendee('${pid}','${sid}','${esc(o)}',this.checked)"> ${esc(o)}</label>`).join('')}</div><div class="row" style="margin-top:12px"><input class="input" id="mo_new" placeholder="Add attendee option"><button class="btn small" onclick="addMeetingOption('${pid}','${sid}')">+ Add</button></div><div class="modal-actions"><button class="btn primary" onclick="closeModal();renderSettings()">Done</button></div>`)}
function setMeetingAttendee(pid,sid,o,on){const s=state.company.phases.find(x=>x.id===pid).steps.find(x=>x.id===sid);s.meetingWith=s.meetingWith||[];s.meetingWith=on?[...new Set([...s.meetingWith,o])]:s.meetingWith.filter(x=>x!==o);save(false)}
function addMeetingOption(pid,sid){const v=document.getElementById('mo_new').value.trim();if(v&&!state.company.meetingOptions.includes(v))state.company.meetingOptions.push(v);save(false);showMeetingPicker(pid,sid)}
function settingsRoles(){const roles=[...new Set(allTemplateSteps().map(x=>x.step.role).filter(Boolean))].sort();return section('roles','Default Assignee by Role',`${roles.map(r=>{const a=state.company.roleAssignees[r]||[];return `<div class="file-row"><b>${esc(r)}</b><button class="btn small" onclick="showRolePicker('${esc(r)}')">${a.length?a.slice(0,2).map(esc).join(', ')+(a.length>2?` +${a.length-2}`:''):'Unassigned'}</button></div>`}).join('')}`)}
function showRolePicker(role){const selected=state.company.roleAssignees[role]||[];modal(`<h2>${esc(role)} Assignees</h2><div class="stack">${activeUsers().map(n=>`<label><input type="checkbox" ${selected.includes(n)?'checked':''} onchange="toggleRolePerson('${esc(role)}','${esc(n)}',this.checked)"> ${esc(n)}</label>`).join('')}<div class="section-title" style="margin-top:10px">Outsourced / External</div>${state.company.externalContacts.map(n=>`<div class="row between"><label><input type="checkbox" ${selected.includes(n)?'checked':''} onchange="toggleRolePerson('${esc(role)}','${esc(n)}',this.checked)"> ${esc(n)}</label><button class="btn icon danger small" onclick="removeExternal('${esc(n)}')">×</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><input class="input" id="ext_name" placeholder="Add external person"><button class="btn small" onclick="addExternal('${esc(role)}')">+ Add Person</button></div><div class="modal-actions"><button class="btn primary" onclick="closeModal();renderSettings()">Done</button></div>`)}
function toggleRolePerson(role,n,on){state.company.roleAssignees[role]=state.company.roleAssignees[role]||[];state.company.roleAssignees[role]=on?[...new Set([...state.company.roleAssignees[role],n])]:state.company.roleAssignees[role].filter(x=>x!==n);save(false)}
function addExternal(role){const n=document.getElementById('ext_name').value.trim();if(!n||people().includes(n))return toast('Name already exists');state.company.externalContacts.push(n);save(false);showRolePicker(role)}
function removeExternal(n){if(!confirm(`Remove ${n} from external contacts and every role assignment?`))return;state.company.externalContacts=state.company.externalContacts.filter(x=>x!==n);Object.keys(state.company.roleAssignees).forEach(r=>state.company.roleAssignees[r]=state.company.roleAssignees[r].filter(x=>x!==n));save(false);closeModal();renderSettings()}
function settingsTaskDefaults(){return section('taskdefaults','Default Task Assignees',`<p class="small muted">Optional defaults for flat milestone/task names. This remains separate from role-based project-step ownership.</p><div class="row"><input class="input" id="td_name" placeholder="Task / milestone name"><select class="input" id="td_person"><option value="">Unassigned</option>${activeUsers().map(n=>`<option>${esc(n)}</option>`).join('')}</select><button class="btn small" onclick="addTaskDefault()">Add</button></div>${Object.entries(state.company.taskDefaults||{}).map(([k,v])=>`<div class="file-row"><span>${esc(k)}</span><span>${esc(v||'Unassigned')}</span></div>`).join('')}`)}
function addTaskDefault(){const k=document.getElementById('td_name').value.trim();if(!k)return;state.company.taskDefaults[k]=document.getElementById('td_person').value;save(false);renderSettings()}
function settingsClientDescriptions(){return section('clientdesc','Client-Facing Phase Descriptions',`<div class="client-phase-grid">${sortedPhases().map(ph=>`<div class="client-phase" style="--pc:${ph.color||phaseColor(ph.number)}"><div class="row"><span class="phase-num" style="background:${ph.color||phaseColor(ph.number)};color:white">${ph.number}</span><b>${esc(ph.name)}</b></div><textarea class="input" style="margin-top:8px;min-height:100px" onchange="setPhaseDescription('${ph.id}',this.value)">${esc(ph.description||'')}</textarea></div>`).join('')}</div>`)}
function setPhaseDescription(id,v){state.company.phases.find(x=>x.id===id).description=v;save(false)}
function settingsScheduleTemplate(){return section('scheduletemplate','Standard Schedule Template',`<table class="table"><thead><tr><th>Phase</th><th>Typical Business Days</th><th>Steps</th></tr></thead><tbody>${sortedPhases().map(ph=>`<tr><td>Phase ${ph.number} · ${esc(ph.name)}</td><td>${ph.steps.reduce((a,s)=>a+(Number(s.duration)||0),0)}</td><td>${ph.steps.map(s=>`${esc(s.title)} (${s.duration}d)`).join('<br>')}</td></tr>`).join('')}</tbody></table>`)}

function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function previewData(id,type){let arr=currentProject()[type];const f=arr.find(x=>x.id===id);previewFile(f)}
function previewFile(f){if(!f)return;const isImg=(f.mime||'').startsWith('image/')||String(f.data||'').startsWith('data:image/');document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal preview-modal"><div class="row between" style="margin-bottom:10px"><b>${esc(f.title||f.name||'Preview')}</b><div class="row"><a class="btn small" href="${f.data}" download="${esc(f.name||'download')}">Download</a><button class="btn small" onclick="closeModal()">Close</button></div></div><div class="preview-body">${isImg?`<img src="${f.data}">`:`<iframe src="${f.data}"></iframe>`}</div></div></div>`}
function previewFileByObject(kind,id,fid){if(kind==='task'){const t=currentProject().tasks.find(x=>x.id===id),f=t.attachments.find(x=>x.id===fid);previewFile(f)}}
async function addTaskFiles(id,fileList){const t=currentProject().tasks.find(x=>x.id===id);t.attachments=t.attachments||[];for(const f of [...fileList])t.attachments.push({id:uid(),name:f.name,mime:f.type||'application/octet-stream',data:await readFile(f)});save(false);showTaskModal(id)}
function removeTaskFile(id,fid){const t=currentProject().tasks.find(x=>x.id===id);t.attachments=t.attachments.filter(x=>x.id!==fid);save(false);showTaskModal(id)}

// Apply stored theme colors
function applyStoredTheme(){for(const [k,css] of Object.entries({ink:'--ink',accent:'--accent',jade:'--jade',rust:'--rust',gold:'--gold'})){const v=state.company.branding?.colors?.[k];if(v)document.documentElement.style.setProperty(css,v)}}
const originalRender=render;render=function(){applyStoredTheme();return originalRender();};
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'&&!session)renderLogin();});
bootApp();
</script>
</body>
</html>
