function projectTeamPanel(p){const a=projectContactById(p.architectId),d=projectContactById(p.designerId);return `<div class="card pad" style="margin:10px 0 12px"><div class="row between wrap"><div><div class="section-title">Project Design Team</div><div class="small muted">Set the architect and designer for this specific project.</div></div><button class="btn small" onclick="nav('settings');setTimeout(()=>location.hash='projectcontacts',10)">Manage Contact Database</button></div><div class="split" style="margin-top:10px"><div class="field"><label>Architect</label><select onchange="setProjectField('architectId',this.value)"><option value="">Not Assigned</option>${projectContactOptions('Architect',p.architectId)}</select>${a?`<div class="tiny muted">${esc(a.email||'')}${a.email&&a.phone?' · ':''}${esc(a.phone||'')}</div>`:''}</div><div class="field"><label>Designer</label><select onchange="setProjectField('designerId',this.value)"><option value="">Not Assigned</option>${projectContactOptions('Designer',p.designerId)}</select>${d?`<div class="tiny muted">${esc(d.email||'')}${d.email&&d.phone?' · ':''}${esc(d.phone||'')}</div>`:''}</div></div></div>`}
function settingsProjectContacts(){const rows=(state.company.projectContacts||[]);return section('projectcontacts','Architects & Designers',`<p class="small muted">Maintain the people you regularly use, then select the architect and designer independently on each project.</p>${rows.length?`<table class="table"><thead><tr><th>Name</th><th>Type</th><th>Company</th><th>Email / Phone</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.type)}</td><td>${esc(c.company||'')}</td><td><div>${esc(c.email||'')}</div><div class="tiny muted">${esc(c.phone||'')}</div></td><td><button class="btn small" onclick="showProjectContactModal('${c.id}')">Edit</button> <button class="btn small danger" onclick="deleteProjectContact('${c.id}')">×</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No architects or designers saved yet.</div>`}`,`<button class="btn primary small" onclick="showProjectContactModal()">+ Add Contact</button>`)}
function showProjectContactModal(id=''){const c=projectContactById(id)||{id:'',name:'',type:'Architect',company:'',email:'',phone:''};modal(`<h2>${id?'Edit':'Add'} Architect / Designer</h2><div class="split"><div class="field"><label>Name</label><input id="pc_name" value="${esc(c.name)}"></div><div class="field"><label>Type</label><select id="pc_type"><option ${c.type==='Architect'?'selected':''}>Architect</option><option ${c.type==='Designer'?'selected':''}>Designer</option><option ${c.type==='Both'?'selected':''}>Both</option></select></div><div class="field"><label>Company</label><input id="pc_company" value="${esc(c.company||'')}"></div><div class="field"><label>Email</label><input id="pc_email" type="email" value="${esc(c.email||'')}"></div><div class="field"><label>Phone</label><input id="pc_phone" value="${esc(c.phone||'')}"></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProjectContact('${id}')">Save Contact</button></div>`)}
function saveProjectContact(id=''){const name=document.getElementById('pc_name').value.trim();if(!name)return toast('Name is required.');const data={name,type:document.getElementById('pc_type').value,company:document.getElementById('pc_company').value.trim(),email:document.getElementById('pc_email').value.trim(),phone:document.getElementById('pc_phone').value.trim()};if(id){Object.assign(projectContactById(id),data)}else{state.company.projectContacts.push({id:uid(),...data})}save(false);closeModal();renderSettings();location.hash='projectcontacts'}
function deleteProjectContact(id){const c=projectContactById(id);if(!c||!confirm(`Remove ${c.name} from the architect/designer database? Existing project assignments will be cleared.`))return;state.company.projectContacts=state.company.projectContacts.filter(x=>x.id!==id);state.projects.forEach(p=>{if(p.architectId===id)p.architectId='';if(p.designerId===id)p.designerId=''});save(false);renderSettings();location.hash='projectcontacts'}
function renderSettings(){document.getElementById('app').innerHTML=shell(`<div class="settings-nav">${[['users','Users'],['projectcontacts','Architects & Designers'],['locations','Locations'],['automations','Automations'],['templates','Document Templates'],['estimatetemplate','Estimate Template'],['branding','Branding'],['storage','Data & Storage'],['backups','Backups'],['process','Manage Process'],['roles','Role Assignees'],['taskdefaults','Task Defaults'],['clientdesc','Client Descriptions'],['scheduletemplate','Schedule Template']].map(([id,l])=>`<a href="#${id}">${l}</a>`).join('')}</div>${settingsUsers()}${settingsProjectContacts()}${settingsLocations()}${settingsAutomations()}${settingsTemplates()}${settingsEstimateTemplate()}${settingsBranding()}${settingsStorage()}${settingsBackups()}${settingsProcess()}${settingsRoles()}${settingsTaskDefaults()}${settingsClientDescriptions()}${settingsScheduleTemplate()}`,'Company Settings');}
function section(id,title,body,action=''){return `<section id="${id}" class="settings-section"><div class="card"><div class="setting-title"><div><div class="eyebrow">Company Settings</div><h2 class="subhead">${title}</h2></div>${action}</div>${body}</div></section>`}
function settingsUsers(){return section('users','Users & Permissions',`<table class="table"><thead><tr><th>Name</th><th>Role</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody>${state.company.users.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="tiny muted">${esc(u.email||'No login email')}</div></td><td>${esc(u.role)}</td><td>${esc(u.location||'')}</td><td><span class="chip ${u.status==='Active'?'good':'slate'}">${u.status}</span></td><td><button class="btn small" onclick="showUserModal('${u.id}')">Edit</button></td></tr>`).join('')}</tbody></table>`,`<button class="btn primary small" onclick="showUserModal()">+ Add User</button>`)}
function showUserModal(id=''){const u=id?state.company.users.find(x=>x.id===id):{name:'',role:'',location:'',status:'Active',email:''};modal(`<h2>${id?'Edit':'Add'} User</h2><div class="split"><div class="field"><label>Name</label><input id="u_name" value="${esc(u.name)}"></div><div class="field"><label>Role</label><input id="u_role" value="${esc(u.role)}"></div><div class="field"><label>Location</label><select id="u_loc"><option value="">None</option>${state.company.locations.map(l=>`<option ${u.location===l?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="u_status"><option ${u.status==='Active'?'selected':''}>Active</option><option ${u.status==='Inactive'?'selected':''}>Inactive</option></select></div></div><div class="field" style="margin-top:10px"><label>Login Email</label><input id="u_email" type="email" value="${esc(u.email||'')}"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUser('${id}')">Save User</button></div>`)}
function saveUser(id){let u=id?state.company.users.find(x=>x.id===id):{id:uid()};u.name=document.getElementById('u_name').value.trim();u.role=document.getElementById('u_role').value.trim();u.location=document.getElementById('u_loc').value;u.status=document.getElementById('u_status').value;u.email=document.getElementById('u_email').value.trim();if(!id)state.company.users.push(u);save(false);closeModal();renderSettings()}
function settingsLocations(){return section('locations','Locations',`<div class="row wrap">${state.company.locations.map((l,i)=>`<span class="chip">${esc(l)} <button style="border:0;background:transparent" onclick="removeLocation(${i})">×</button></span>`).join('')}</div><div class="row" style="margin-top:10px"><input class="input" id="new_loc" placeholder="Add location"><button class="btn small" onclick="addLocation()">+ Add</button></div>`)}
function addLocation(){const v=document.getElementById('new_loc').value.trim();if(v&&!state.company.locations.includes(v)){state.company.locations.push(v);save(false);renderSettings()}}
function removeLocation(i){if(confirm('Remove this location?')){state.company.locations.splice(i,1);save(false);renderSettings()}}
function settingsAutomations(){const tomorrow=iso(new Date(Date.now()+86400000));const meetings=state.projects.flatMap(p=>p.meetingNotes.filter(m=>m.date===tomorrow).map(m=>({project:p.name,...m})));return section('automations','Automations',`<div class="notice"><b>Meetings Needing a Reminder Tomorrow</b>${meetings.length?meetings.map(m=>`<div class="file-row"><span>${esc(m.project)} · ${esc(m.type)}</span><button class="btn small">Send Reminder</button></div>`).join(''):`<div class="small muted" style="margin-top:5px">No meetings due tomorrow.</div>`}</div><table class="table" style="margin-top:10px"><thead><tr><th>Name</th><th>Trigger</th><th>Action</th><th>Status</th></tr></thead><tbody>${state.company.automations.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.trigger)}</td><td>${esc(a.action)}</td><td>${a.enabled?'On':'Off'}</td></tr>`).join('')}</tbody></table>`,`<button class="btn small" onclick="showAutomationModal()">+ New Automation</button>`)}
function showAutomationModal(){modal(`<h2>New Automation</h2><div class="field"><label>Name</label><input id="a_name"></div><div class="split" style="margin-top:10px"><div class="field"><label>Trigger</label><input id="a_trigger" placeholder="e.g. Step completed"></div><div class="field"><label>Action</label><input id="a_action" placeholder="e.g. Create task"></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAutomation()">Save</button></div>`)}
function saveAutomation(){state.company.automations.push({id:uid(),name:document.getElementById('a_name').value,trigger:document.getElementById('a_trigger').value,action:document.getElementById('a_action').value,enabled:true});save(false);closeModal();renderSettings()}
function settingsTemplates(){const slots=[['preliminary','Preliminary Proposal'],['formal','Formal Proposal'],['agreement','Construction Agreement']];return section('templates','Document Templates',`<div class="three">${slots.map(([k,l])=>`<div class="doc-slot"><b>${l}</b><p class="small muted">${state.company.documentTemplates[k]?.name||'No template uploaded'}</p><label class="btn small">${state.company.documentTemplates[k]?'Replace':'Upload'}<input type="file" hidden onchange="uploadTemplate('${k}',this.files[0])"></label>${state.company.documentTemplates[k]?` <button class="btn small" onclick="previewTemplate('${k}')">View</button>`:''}</div>`).join('')}</div>`)}
async function uploadTemplate(k,f){if(!f)return;state.company.documentTemplates[k]={id:uid(),name:f.name,mime:f.type||'application/octet-stream',data:await readFile(f),uploadedAt:new Date().toISOString()};save(false);renderSettings()}
function settingsEstimateTemplate(){const t=state.company.estimateTemplate||{};return section('estimatetemplate','Estimate Template',`<p class="small muted">This is the master Google Sheet used to start every project estimate. ALIGN should never edit the master directly; each project should use its own copy.</p><div class="split" style="margin-top:12px"><div class="field"><label>Template Name</label><input id="estimate_tpl_name" value="${esc(t.name||'')}" placeholder="MCD Estimating Template"></div><div class="field"><label>Google Sheet Template URL</label><input id="estimate_tpl_url" value="${esc(t.url||'')}" placeholder="https://docs.google.com/spreadsheets/d/..."></div></div><div class="row wrap" style="margin-top:12px"><button class="btn primary" onclick="saveEstimateTemplate()">Save Template</button>${t.url?`<a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener">Open Template ↗</a><a class="btn" href="${sheetCopyUrl(t.url)}" target="_blank" rel="noopener">Test Create Copy ↗</a>`:''}</div>`)}
function saveEstimateTemplate(){const url=document.getElementById('estimate_tpl_url').value.trim();if(url&&!sheetIdFromUrl(url))return alert('Paste a valid Google Sheets URL.');state.company.estimateTemplate={name:document.getElementById('estimate_tpl_name').value.trim()||'Estimating Template',url};save(false);renderSettings();toast('Estimate template saved')}
function settingsBranding(){const b=state.company.branding||{};return section('branding','Branding',`<div class="split"><div><div class="field"><label>Company Logo</label><div class="small muted" style="margin-bottom:7px">Upload the full Mitchell Construction & Design logo. It will appear full-width in the sidebar with ALIGN centered directly underneath.</div><input type="file" accept="image/*" onchange="uploadLogo(this.files[0])"></div>${b.logo?`<img class="logo-preview" style="width:${b.logoSize||120}px;margin-top:10px" src="${b.logo}">`:''}<div class="field" style="margin-top:10px"><label>Logo Size <span>${b.logoSize||120}px</span></label><input type="range" min="60" max="220" value="${b.logoSize||120}" oninput="setLogoSize(this.value)"></div></div><div>${[['ink','Primary Ink','--ink'],['accent','Accent / Taupe','--accent'],['jade','Success / Jade','--jade'],['rust','Alert / Rust','--rust'],['gold','Highlight / Gold','--gold']].map(([k,l,css])=>`<div class="color-row"><b class="small">${l}</b><input type="color" value="${b.colors?.[k]||rgbToHex(getComputedStyle(document.documentElement).getPropertyValue(css).trim())}" onchange="setThemeColor('${k}','${css}',this.value)"><code>${css}</code></div>`).join('')}<button class="btn small" onclick="resetTheme()">Reset to Defaults</button></div></div>`)}
function rgbToHex(c){return /^#/.test(c)?c:'#555555'}
async function uploadLogo(f){if(!f)return;state.company.branding.logo=await readFile(f);save(false);renderSettings()}
function setLogoSize(v){state.company.branding.logoSize=Number(v);save(false);renderSettings()}
function setThemeColor(k,css,v){state.company.branding.colors=state.company.branding.colors||{};state.company.branding.colors[k]=v;document.documentElement.style.setProperty(css,v);save(false)}
function resetTheme(){state.company.branding.colors={};save(false);location.reload()}
function settingsStorage(){return section('storage','Data & Storage',`<div class="row between wrap"><div><b>${syncStatus==='live'?'Shared workspace synced':'Shared workspace status: '+syncStatus}</b><div class="small muted">Supabase is the company-wide source of truth. Every authenticated employee should load the same projects, settings, logo and tasks.</div><div class="tiny muted" style="margin-top:5px">Shared: ${workspaceSummary(sharedPayload())} · ${state.lastSaved?'Last sync '+new Date(state.lastSaved).toLocaleString():'Not synced yet'} · ${BUILD}</div></div><div class="row wrap"><button class="btn" onclick="reloadSharedWorkspace()">↻ Reload Shared Data</button>${legacyState&&meaningfulWorkspace(legacyState)?`<button class="btn primary" onclick="publishLocalWorkspace(true)">Publish This Browser to Team</button>`:''}<button class="btn danger" onclick="resetAllData()">Reset Shared Workspace</button></div></div>`)}
function resetAllData(){if(!confirm('This will wipe every project and setting in this browser. Continue?'))return;state=defaultState();save(false);renderSettings()}
function settingsBackups(){return section('backups','Emergency Backups',`<div class="row between"><div class="small muted">Independent rotating snapshots. Prototype stores up to 24 local snapshots.</div><button class="btn small" onclick="makeBackup()">Create Snapshot</button></div><div style="margin-top:8px">${(state.company.backups||[]).slice().reverse().map(b=>`<div class="file-row"><span>${new Date(b.time).toLocaleString()}</span><button class="btn small" onclick="restoreBackup('${b.id}')">Restore this backup</button></div>`).join('')||'<div class="empty">No snapshots yet.</div>'}</div>`)}
function makeBackup(){const clone=JSON.parse(JSON.stringify(state));clone.company.backups=[];state.company.backups=state.company.backups||[];state.company.backups.push({id:uid(),time:new Date().toISOString(),data:clone});if(state.company.backups.length>24)state.company.backups.shift();state.company.backupCounter=(state.company.backupCounter||0)+1;save(false);renderSettings()}
function restoreBackup(id){if(!confirm('Restore this snapshot and replace the current live state?'))return;const b=state.company.backups.find(x=>x.id===id);if(!b)return;const backups=state.company.backups;state=JSON.parse(JSON.stringify(b.data));state.company.backups=backups;save(false);renderSettings()}

function roleDropdownOptions(selected){
  const defaults=['Architect','Designer','Client','Estimator','Subcontractor','Entire Team','S/C','P/C Coordinator','Estimator & S/C','S/C & Estimator'];
  const fromSettings=Object.keys(state.company.roleAssignees||{});
  const fromProcess=(state.company.phases||[]).flatMap(ph=>(ph.steps||[]).map(st=>st.role)).filter(Boolean);
  const roles=[...new Set([...defaults,...fromSettings,...fromProcess])].sort((a,b)=>a.localeCompare(b));
  if(selected && !roles.includes(selected)) roles.unshift(selected);
  return roles.map(r=>`<option value="${esc(r)}" ${r===selected?'selected':''}>${esc(r)}</option>`).join('');
}
function settingsProcess(){return section('process','Preconstruction Process (Manage Process)',`${sortedPhases().map((ph,pi)=>`<div class="phase-settings"><div class="phase-settings-head"><input class="input" type="number" min="1" value="${ph.number}" onchange="renumberPhase('${ph.id}',this.value)"><input class="input" value="${esc(ph.name)}" onchange="renamePhase('${ph.id}',this.value)"><span class="chip">${ph.steps.reduce((a,s)=>a+(Number(s.duration)||0),0)} business days</span><button class="btn small danger" onclick="deletePhase('${ph.id}')">Delete Phase</button></div>${ph.steps.map((s,si)=>`<div class="template-step"><div class="row"><button class="btn icon small" onclick="moveStep('${ph.id}','${s.id}',-1)">↑</button><button class="btn icon small" onclick="moveStep('${ph.id}','${s.id}',1)">↓</button></div><input class="input" value="${esc(s.title)}" onchange="editTemplateStep('${ph.id}','${s.id}','title',this.value)"><select class="input" onchange="editTemplateStep('${ph.id}','${s.id}','role',this.value)">${roleDropdownOptions(s.role)}</select><input class="input" type="number" min="1" value="${s.duration}" onchange="editTemplateStep('${ph.id}','${s.id}','duration',this.value)"><div class="revision-control"><label class="small"><input type="checkbox" ${s.canRevise?'checked':''} onchange="editTemplateStep('${ph.id}','${s.id}','canRevise',this.checked)"> Can Revise</label>${s.canRevise?`<select class="input small" onchange="setRevisionTarget('${ph.id}','${s.id}',this.value)"><option value="">— pick the earlier step it goes back to —</option>${ph.steps.slice(0,si).map(t=>`<option value="${t.id}" ${s.revisesStepId===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select>`:''}</div><div class="meeting-setting"><label class="small"><input type="checkbox" ${s.needsMeeting?'checked':''} onchange="toggleMeeting('${ph.id}','${s.id}',this.checked)"> Needs Meeting</label>${s.needsMeeting?`<button class="meeting-attendees-summary" onclick="showMeetingPicker('${ph.id}','${s.id}')">${(s.meetingWith||[]).length?esc((s.meetingWith||[]).join(', ')):'Set attendees'}</button>`:''}</div><button class="btn icon danger small" onclick="deleteTemplateStep('${ph.id}','${s.id}')">×</button></div>`).join('')}<div style="padding:10px"><button class="btn small" onclick="addTemplateStep('${ph.id}')">+ Add Step to Phase ${ph.number}</button></div></div>`).join('')}<button class="btn primary" onclick="addPhase()">+ Add Phase</button>`)}
function renamePhase(id,v){state.company.phases.find(x=>x.id===id).name=v;save(false);renderSettings()}
function renumberPhase(id,v){v=Number(v);if(!Number.isInteger(v)||v<1)return renderSettings();if(state.company.phases.some(x=>x.id!==id&&x.number===v)){alert('That phase number is already in use. Renumber the conflicting phase first.');return renderSettings()}const ph=state.company.phases.find(x=>x.id===id),old=ph.number;if(!confirm(`Renumber Phase ${old} to Phase ${v}? This updates every project using that phase number.`))return renderSettings();ph.number=v;state.projects.forEach(p=>{if(p.currentPhase===old)p.currentPhase=v;p.projectSteps.forEach(s=>{if(s.phaseNumber===old)s.phaseNumber=v})});state.company.phases.sort((a,b)=>a.number-b.number);save(false);renderSettings()}
function deletePhase(id){if(state.company.phases.length<=1)return alert('The last remaining phase cannot be deleted.');const ph=state.company.phases.find(x=>x.id===id);if(!confirm(`Delete Phase ${ph.number} · ${ph.name}? Projects currently on it may need manual attention.`))return;state.company.phases=state.company.phases.filter(x=>x.id!==id);state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function addPhase(){const name=prompt('New phase name:');if(!name)return;const num=Math.max(...state.company.phases.map(p=>p.number))+1;state.company.phases.push({id:uid(),number:num,name,color:phaseColor(num),description:'',steps:[]});save(false);renderSettings()}
function addTemplateStep(pid){const ph=state.company.phases.find(x=>x.id===pid);ph.steps.push({id:uid(),title:'New Step',role:'Entire Team',duration:1,canRevise:false,revisesStepId:null,needsMeeting:false,meetingWith:[]});state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function deleteTemplateStep(pid,sid){if(!confirm('Delete this step from the company process?'))return;const ph=state.company.phases.find(x=>x.id===pid);ph.steps=ph.steps.filter(s=>s.id!==sid);state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function moveStep(pid,sid,dir){const ph=state.company.phases.find(x=>x.id===pid),i=ph.steps.findIndex(x=>x.id===sid),j=i+dir;if(j<0||j>=ph.steps.length)return;[ph.steps[i],ph.steps[j]]=[ph.steps[j],ph.steps[i]];state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function editTemplateStep(pid,sid,key,val){const ph=state.company.phases.find(x=>x.id===pid),s=ph.steps.find(x=>x.id===sid);s[key]=key==='duration'?Number(val):val;if(key==='canRevise'&&!val)s.revisesStepId=null;state.projects.forEach(p=>ensureProjectStepSync(p));save(false);renderSettings()}
function setRevisionTarget(pid,sid,targetId){const ph=state.company.phases.find(x=>x.id===pid),s=ph.steps.find(x=>x.id===sid);if(!s)return;const fromIndex=ph.steps.findIndex(x=>x.id===sid),targetIndex=ph.steps.findIndex(x=>x.id===targetId);if(targetId&&targetIndex>=fromIndex){alert('A revision can only return to an earlier step in the same phase.');return renderSettings()}s.revisesStepId=targetId||null;save(false);renderSettings()}
function sendCurrentStepForRevision(){const p=currentProject(),cs=currentStep(p);if(!cs)return;const tpl=allTemplateSteps().find(x=>x.step.id===cs.templateStepId);if(!tpl?.step.canRevise)return toast('This step is not marked as revisable.');const targetTplId=tpl.step.revisesStepId;if(!targetTplId)return alert('Choose a revision return step in Company Settings first.');const target=p.projectSteps.find(x=>x.templateStepId===targetTplId&&Number(x.phaseNumber)===Number(cs.phaseNumber));if(!target)return alert('The revision target could not be found in this project.');if(!confirm(`Send this work back for revision to “${target.title}”?`))return;const start=p.projectSteps.findIndex(x=>x.id===target.id),end=p.projectSteps.findIndex(x=>x.id===cs.id);for(let i=start;i<=end;i++){const s=p.projectSteps[i];s.status=i===start?'working':'not_started';s.completedDate='';if(i!==start)s.startedDate='';}target.startedDate=target.startedDate||today();recomputeProjectPhase(p);recalcForecast(p);save(false);renderProject();toast(`Revision returned to: ${target.title}`)}
function toggleMeeting(pid,sid,checked){const s=state.company.phases.find(x=>x.id===pid).steps.find(x=>x.id===sid);s.needsMeeting=checked;save(false);if(checked)showMeetingPicker(pid,sid);else renderSettings()}
function showMeetingPicker(pid,sid){const s=state.company.phases.find(x=>x.id===pid).steps.find(x=>x.id===sid);modal(`<h2>Who's in this meeting?</h2><p class="small muted">${esc(s.title)}</p><div class="stack">${state.company.meetingOptions.map(o=>`<label><input type="checkbox" ${s.meetingWith.includes(o)?'checked':''} onchange="setMeetingAttendee('${pid}','${sid}','${esc(o)}',this.checked)"> ${esc(o)}</label>`).join('')}</div><div class="row" style="margin-top:12px"><input class="input" id="mo_new" placeholder="Add attendee option"><button class="btn small" onclick="addMeetingOption('${pid}','${sid}')">+ Add</button></div><div class="modal-actions"><button class="btn primary" onclick="closeModal();renderSettings()">Done</button></div>`)}
function setMeetingAttendee(pid,sid,o,on){const s=state.company.phases.find(x=>x.id===pid).steps.find(x=>x.id===sid);s.meetingWith=s.meetingWith||[];s.meetingWith=on?[...new Set([...s.meetingWith,o])]:s.meetingWith.filter(x=>x!==o);save(false)}
function addMeetingOption(pid,sid){const v=document.getElementById('mo_new').value.trim();if(v&&!state.company.meetingOptions.includes(v))state.company.meetingOptions.push(v);save(false);showMeetingPicker(pid,sid)}
function settingsRoles(){const roles=[...new Set(allTemplateSteps().map(x=>x.step.role).filter(Boolean))].sort();return section('roles','Default Assignee by Role',`${roles.map(r=>{const a=state.company.roleAssignees[r]||[];return `<div class="file-row"><b>${esc(r)}</b><button class="btn small" onclick="showRolePicker('${esc(r)}')">${a.length?a.slice(0,2).map(esc).join(', ')+(a.length>2?` +${a.length-2}`:''):'Unassigned'}</button></div>`}).join('')}`)}
function showRolePicker(role){const selected=state.company.roleAssignees[role]||[];modal(`<h2>${esc(role)} Assignees</h2><div class="stack">${activeUsers().map(n=>`<label><input type="checkbox" ${selected.includes(n)?'checked':''} onchange="toggleRolePerson('${esc(role)}','${esc(n)}',this.checked)"> ${esc(n)}</label>`).join('')}<div class="section-title" style="margin-top:10px">Outsourced / External</div>${state.company.externalContacts.map(n=>`<div class="row between"><label><input type="checkbox" ${selected.includes(n)?'checked':''} onchange="toggleRolePerson('${esc(role)}','${esc(n)}',this.checked)"> ${esc(n)}</label><button class="btn icon danger small" onclick="removeExternal('${esc(n)}')">×</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><input class="input" id="ext_name" placeholder="Add external person"><button class="btn small" onclick="addExternal('${esc(role)}')">+ Add Person</button></div><div class="modal-actions"><button class="btn primary" onclick="closeModal();renderSettings()">Done</button></div>`)}
function toggleRolePerson(role,n,on){state.company.roleAssignees[role]=state.company.roleAssignees[role]||[];state.company.roleAssignees[role]=on?[...new Set([...state.company.roleAssignees[role],n])]:state.company.roleAssignees[role].filter(x=>x!==n);save(false)}
function addExternal(role){const n=document.getElementById('ext_name').value.trim();if(!n||people().includes(n))return toast('Name already exists');state.company.externalContacts.push(n);save(false);showRolePicker(role)}
function removeExternal(n){if(!confirm(`Remove ${n} from external contacts and every role assignment?`))return;state.company.externalContacts=state.company.externalContacts.filter(x=>x!==n);Object.keys(state.company.roleAssignees).forEach(r=>state.company.roleAssignees[r]=state.company.roleAssignees[r].filter(x=>x!==n));save(false);closeModal();renderSettings()}
function settingsTaskDefaults(){return section('taskdefaults','Default Task Assignees',`<p class="small muted">Optional defaults for flat milestone/task names. This remains separate from role-based project-step ownership.</p><div class="row"><input class="input" id="td_name" placeholder="Task / milestone name"><select class="input" id="td_person"><option value="">Unassigned</option>${activeUsers().map(n=>`<option>${esc(n)}</option>`).join('')}</select><button class="btn small" onclick="addTaskDefault()">Add</button></div>${Object.entries(state.company.taskDefaults||{}).map(([k,v])=>`<div class="file-row"><span>${esc(k)}</span><span>${esc(v||'Unassigned')}</span></div>`).join('')}`)}
function addTaskDefault(){const k=document.getElementById('td_name').value.trim();if(!k)return;state.company.taskDefaults[k]=document.getElementById('td_person').value;save(false);renderSettings()}
function settingsClientDescriptions(){return section('clientdesc','Client-Facing Phase Descriptions',`<div class="client-phase-grid">${sortedPhases().map(ph=>`<div class="client-phase" style="--pc:${ph.color||phaseColor(ph.number)}"><div class="row"><span class="phase-num" style="background:${ph.color||phaseColor(ph.number)};color:white">${ph.number}</span><b>${esc(ph.name)}</b></div><textarea class="input" style="margin-top:8px;min-height:100px" onchange="setPhaseDescription('${ph.id}',this.value)">${esc(ph.description||'')}</textarea></div>`).join('')}</div>`)}
function setPhaseDescription(id,v){state.company.phases.find(x=>x.id===id).description=v;save(false)}
function settingsScheduleTemplate(){return section('scheduletemplate','Standard Schedule Template',`<table class="table"><thead><tr><th>Phase</th><th>Typical Business Days</th><th>Steps</th></tr></thead><tbody>${sortedPhases().map(ph=>`<tr><td>Phase ${ph.number} · ${esc(ph.name)}</td><td>${ph.steps.reduce((a,s)=>a+(Number(s.duration)||0),0)}</td><td>${ph.steps.map(s=>`${esc(s.title)} (${s.duration}d)`).join('<br>')}</td></tr>`).join('')}</tbody></table>`)}

function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function previewData(id,type){let arr=currentProject()[type];const f=arr.find(x=>x.id===id);previewFile(f)}
function previewFile(f){if(!f)return;const isImg=(f.mime||'').startsWith('image/')||String(f.data||'').startsWith('data:image/');document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal preview-modal"><div class="row between" style="margin-bottom:10px"><b>${esc(f.title||f.name||'Preview')}</b><div class="row"><a class="btn small" href="${f.data}" download="${esc(f.name||'download')}">Download</a><button class="btn small" onclick="closeModal()">Close</button></div></div><div class="preview-body">${isImg?`<img src="${f.data}">`:`<iframe src="${f.data}"></iframe>`}</div></div></div>`}
function previewFileByObject(kind,id,fid){if(kind==='task'){const t=currentProject().tasks.find(x=>x.id===id),f=t.attachments.find(x=>x.id===fid);previewFile(f)}}
async function addTaskFiles(id,fileList){const t=currentProject().tasks.find(x=>x.id===id);t.attachments=t.attachments||[];for(const f of [...fileList])t.attachments.push({id:uid(),name:f.name,mime:f.type||'application/octet-stream',data:await readFile(f)});save(false);showTaskModal(id)}
function removeTaskFile(id,fid){const t=currentProject().tasks.find(x=>x.id===id);t.attachments=t.attachments.filter(x=>x.id!==fid);save(false);showTaskModal(id)}

// Apply stored theme colors
function applyStoredTheme(){for(const [k,css] of Object.entries({ink:'--ink',accent:'--accent',jade:'--jade',rust:'--rust',gold:'--gold'})){const v=state.company.branding?.colors?.[k];if(v)document.documentElement.style.setProperty(css,v)}}
const originalRender=render;render=function(){applyStoredTheme();return originalRender();};
sb.auth.onAuthStateChange((event,session)=>{if(clientViewSnapshotFromUrl()||clientPortalTokenFromUrl())return;if(event==='SIGNED_OUT'&&!session)renderLogin();});
bootApp();
</script>
</body>
</html>
